# Open Work Tracking Standard - AI Optimized
# Source: core/open-work-tracking.md

standard:
  id: open-work-tracking
  name: Open Work Tracking Standard
  description: 開放工作追蹤標準——承載開放工作的地方必須低摩擦收件、記錄解除條件、生成可推導欄位、印出分母、在回合結束時被檢視而不阻斷、把目標與進度分開並替目標的修改留痕、讓每個下一步點名具體對象、分得出「還沒問」與「已問、等回覆」、讓看不見的事實有一個帶戳記、可誠實寫成「未知」、年齡看得見的存放處，並讓等待可以用邏輯名稱點名另一個專案裡的東西、說清楚這台機器看不看得到它

  meta:
    version: "1.4.0"
    updated: "2026-10-07"
    source: core/open-work-tracking.md
    description: >
      三種不同的「工作不見了」的方式（沒地方記新想法、等待中沒有解除條件、
      沒有時鐘的計畫無聲腐爛）常被塞進同一份清單，而合併本身就是失敗的一部分。
      本標準是 deferred-item-exit 的下游一半：DEX 管「延後項目有沒有離開文件」，
      本標準管「離開之後抵達的那個承載庫，自己會不會腐壞」。
      1.1.0 補兩個缺口：目標（意圖）與進度存放在不同載體、目標的修改要留痕（OWT-017／018）；
      下一步要點名具體對象（OWT-019）。
      1.2.0 補兩個狀態：等待分成「還沒問」與「已問、等回覆」（OWT-020／021／022）；
      助理看不到的外部事實容許一個窄例外——手寫列附觀察者、觀察時間，值可誠實寫成未知，
      年齡一律顯示（OWT-023／024／025／026）。
      1.3.0 補兩件事：等待可以用邏輯名稱點名另一個專案裡的東西，並分成已解除／尚未解除／從這裡看不到／需要人判斷四種回報，
      紀錄放在每個相關專案的 session 都讀得到、受版本控制的地方（OWT-027／028／029）；
      「下一步」詞彙補上三個明確同義詞、採用者可宣告自己的詞（不新增要求編號，OWT-019 與 OWT-016 的具體作法）。
      1.4.0 不新增要求編號：處於 asked-awaiting 並滿足 OWT-022 的項目，其下一步可以就是等待的那個回覆，由 OWT-022 判定、不由 OWT-019 判定
      （第四種結果 waiting-on-reply，單獨計數、顯示年齡、不算已點名也不算完成；next-action 與 waiting 以同一個函式讀同一列，不會給相反結論）；
      並補一段說明：OWT-007 的摘要可由程式在回合結束時印出、完整版按需取得（不新增要求、不新增檢查）。

  iron_law: >
    一個承載開放工作的地方，必須：不要求分類就能收下新項目、為每一個等待中項目記下解除條件、
    對可推導的欄位改用生成、回報還剩什麼時同時揭露看不到什麼、
    在控制權從 agent 交回人的那一刻被檢視——而且那個檢視不能讓回合失敗；
    把「這份工作為了什麼」與「做到哪了」分開存放並替前者的每次修改留下交代；
    讓每一個「下一步」都點名一個讀的人找得到的東西；
    分得出「還沒問」與「已問、等回覆」，並讓看不見的事實有一個帶戳記的存放處——
    未知是正式的值、永遠不算完成，每筆觀察的年齡一律顯示；
    讓一個等待可以用邏輯名稱點名另一個專案裡的東西、說明這台機器看不看得到它——看不到的單獨計數、
    既不算已解除也不算零——並把那份紀錄放在每個相關專案的 session 都讀得到、受版本控制的地方。

  # ── 寫法約束：先讀這一段，它拘束下面每一條 ────────────────────────────────
  # 與 deferred-item-exit 受的是同一條約束（DEC-049），套用在下游一層：
  # 本標準只陳述關係，不規定承載庫用什麼工具/格式/系統實作。
  writing_constraint:
    basis: DEC-049
    upstream: deferred-item-exit
    admissible_what:
      - "收件點欄位數必須具備的性質"
      - "等待項目與解除條件之間必須存在的關係"
      - "「這是最新的」這句宣稱必須從什麼可被證明"
      - "一個回報數字與它看不到的部分之間的關係"
      - "控制權交回人的那一點存在一個確認點，且它永不阻斷"
      - "一次目標的修改與說明它的修訂紀錄之間必須存在的關係"
      - "一個等待項目的狀態與「有沒有人問過」的紀錄之間必須存在的關係"
      - "一筆手寫事實與它的戳記、值域、年齡之間必須存在的關係"
      - "一個等待的解除條件與它所點名的另一個專案裡的物件之間必須存在的關係（邏輯名稱，不是目錄）"
    inadmissible_how:
      - "收件點是哪個 app、檔案或工單系統"
      - "輪詢解除條件的排程器或機器人"
      - "具體用哪個雜湊函式、diff 工具或 CI 供應商"
      - "儀表板版面或報告範本"
      - "用什麼 hook 系統、shell 或 cron 實作確認點"
      - "哪一種版本控制系統、核可工具或檔案配置承載目標或其修訂紀錄"
      - "訊息用哪個管道、哪個工具送出，或哪個系統記錄對方的回覆"
      - "跨專案的紀錄存在哪一個 repo、哪一個工具的 session 之間怎麼傳訊（只規定它受版本控制、各方 session 讀得到）"
    consequence: >
      本標準不附帶任何閘門。它只說一個承載開放工作的地方必須具備什麼性質；
      有沒有東西在檢查是採用專案的決定，而 OWT-014／OWT-015 是用來讓那個決定
      沒辦法被默默做掉的。

  guidelines:
    - "收件點必填欄位不得超過兩個——分類/優先級/負責人一律是 triage 時的動作，不得成為輸入門檻"
    - "每個等待中項目都要記下**在等什麼**與**什麼事件視為解除**，解除條件應盡量機器看得到"
    - "凡能從版控/規格標記/CI 結果推導出來的欄位，一律生成，不得手寫"
    - "**生成區段的「最新」宣稱要能從內容本身證明**（例如來源雜湊），不能只靠一個人可以敷衍的日期"
    - "**「內容可證明最新」與「日期宣稱最新、內容未驗證」是兩個不同狀態，不得合併成同一個通過**"
    - "任何「還有 N 項」的數字，必須同時印出看得見多少、看不見多少——看不見的部分不得被讀成零"
    - "確認點要出現在**控制權從 agent 交回人的那一刻**，不能只掛在 shell 啟動、CI 或文件被編輯時"
    - "🔴 確認點**永遠不阻斷**——「還有工作沒做完」幾乎永遠為真，永遠為真的閘門會被關掉"
    - "確認點與阻斷式檢查掛同一事件時，確認點的輸出要排在阻斷判決之前"
    - "判定項目是等待中/未分類/已丟棄，走訪承載庫自己的結構欄位，不要只靠掃描散文措辭"
    - "措辭清單可以補充結構欄位，但涵蓋率必須明示未知，乾淨結果不得回報成「沒有漏掉」"
    - "超過門檻仍未分類的項目要在摘要裡被點名，不得被合併進一個總數"
    - "項目從承載庫消失（drop）必須帶一句理由，不得只是消失"
    - "目標／驗收條件／限制（意圖）與進度／下一步存在不同的載體；判準是結構（小節、欄位、型別化標記），不是檔名——更新進度不得需要碰目標"
    - "目標或驗收條件每次被修改都留下「改了什麼、誰核可、為什麼」；沒有核可者的修改要在控制權交回人時列出來，不得靜默，但列出只是回報、永不阻斷"
    - "「下一步」欄位至少點名一個具體對象——檔案路徑、測試名稱、指令或需求編號之一；只有動詞不算。這是結構判準，不判斷措辭好壞"
    - "處於 asked-awaiting 並滿足 OWT-022（asked-at、在等什麼、解除事件齊全）的項目，其下一步可以就是等待的那個回覆：由 OWT-022 判定、不由 OWT-019 判定，回報為 waiting-on-reply——不算違反、不算已點名、不算完成，單獨列出並顯示年齡；缺任一項、not-yet-asked、其他狀態、寫成小節標題的下一步，照舊由 OWT-019 判定"
    - "點名對象的辨認本身是樣式比對，涵蓋率明示為未知；回報三態（點名且已找到／點名但未找到／未點名），只有未點名是違反"
    - "標為等待的項目要說明自己是「還沒問」（請求已草擬或已決定、尚未送出）還是「已問、等回覆」（已送出、沒有回音）；兩者皆非的等待項目要被個別點名，不得併入總數、不得算成已完成"
    - "「還沒問」的項目點名那份草稿或那個動作（沿用 OWT-019 的辨認）；「已問、等回覆」的項目帶 asked-at，並滿足 OWT-002"
    - "手寫列只容許用在承載庫無法從版控、規格標記或 CI 結果推導的事實；每一列帶 observed-by、observed-at，值為 yes／no／unknown。檢查只判定欄位存在且格式正確，絕不判定觀察為真"
    - "unknown 是正式的值：單獨計數、單獨顯示，永遠不算完成；標為完成而值是 unknown 即違反"
    - "每筆觀察顯示年齡；超過宣告門檻者回報為「觀察已舊」、另計、不算已確認。戳只說誰何時看到，不說現在仍然如此"
    - "手寫例外不及於版控、規格標記或 CI 結果已能決定的欄位（OWT-003 仍成立）；這靠一份主題詞表判定，涵蓋率未知"
    - "等待的解除條件可以點名另一個專案裡的物件，寫成 <專案>:<物件>；專案是邏輯名稱，載體裡不得有機器專屬的絕對路徑；名稱對應哪個目錄宣告在載體之外"
    - "對每個跨專案解除條件回報四種之一，單獨計數：已解除、尚未解除、從這裡看不到（不是已解除也不是零）、需要人判斷；查找只讀本機檔案與版本控制，不連網"
    - "等著另一個專案的工作，其紀錄放在受版本控制、每個相關專案的 session 都讀得到的 repo；不得只放在個人的 AI 工具記憶；檢查不判定存放位置"

  # ── R5 vs turn-completion-integrity：掛同一事件，行為刻意相反 ──────────────
  vs_turn_completion_integrity:
    shared_event: "回合結束、控制權交回人類"
    turn_completion_integrity:
      watches: "agent 自己最後一則訊息裡，被說出口又被放棄的第一人稱承諾"
      default_state: "罕見——只在明確做出承諾又被丟下時觸發"
      on_violation: "擋住回合結束，直到承諾被解決或說明卡在誰身上"
    this_standard:
      watches: "承載庫裡的項目，看有沒有沒解除條件的、沒出口的、或過門檻還沒分類的"
      default_state: "常見——「還有工作沒做完」幾乎永遠為真"
      on_violation: "永不阻斷，只能回報（OWT-008）"
    why_opposite: >
      TCI 自己的規則（TCI R4）已經寫出這裡不能做成閘門的理由：
      一個在每個回合都為真的閘門會被關掉，關掉之後它什麼都不保護。
      開放工作非空幾乎永遠為真，所以本標準的確認點被設計成永不保留控制權。
    ordering_when_co_located: "本標準先回報（OWT-009），即使該回合隨後被 TCI 擋下，回報仍然可見"

  # ── 摘要由誰產生（OWT-007 的說明，1.4.0；不新增要求、不新增檢查）─────────────
  summary_production:
    owt_007_does_not_say: "誰產生摘要、摘要多長"
    cheap_way: "由程式在回合結束時印出簡短摘要（掛在回合結束事件上的既有機制執行一個指令，不消耗模型 token），完整版在讀的人要看時才產生"
    expensive_way: "由模型在每則回覆裡手工附一張完整的表：可行、滿足 OWT-007，但昂貴，不是本標準要求的做法"
    still_applies: "OWT-008 與 OWT-009：程式只回報、永不阻斷，輸出排在任何阻斷式檢查的判決之前"
    suggested_vocabulary: ["等人決策", "等外部（對方回覆）", "等 CI", "固定日期到期", "無人看管"]   # 建議，非要求
    external_example: "有一個採用專案這樣做；其檔案是私有的，所以不放連結；不屬於 UDS 套件，不保證相容"
    honest_note: "UDS 沒有出貨任何產生 OWT-007 摘要的程式，本標準也沒有東西檢查它存在；本段不新增要求編號、不新增檢查"

  # ── 錨點：走訪結構，不走訪措辭（與 DEX-007/DEX-008 同形狀）───────────────
  anchors:
    principle: "判定等待中/未分類/已丟棄，讀承載庫自己描述該狀態的結構欄位——狀態欄、型別化標記、小節標題——而非散文措辭"
    wording_heuristic:
      allowed: true
      but: "涵蓋率必須明示未知；一份含「等待」「未分類」的措辭清單，對用別的寫法表達的項目什麼也不保證"
      general_form: class-level-fix

  # ── 戳 vs 內容：與 DEX-005/DEX-006 同形狀，換了一個 artefact ──────────────
  stamp_vs_content:
    failure: >
      生成區段的時間戳很新，被誤讀成內容是新的。戳比內容舊的情況容易抓（比對修改紀錄）；
      戳比內容新而內容本身已過期——隱形，因為「戳是新的」正是一次正確對帳看起來的樣子。
    fix: "「最新」的宣稱要能從內容本身被證明（例如來源雜湊），不能只靠一個人可編輯的日期"
    two_states_required:
      - state: content_proven_current
        meaning: "從內容本身可證明是最新的（例如雜湊比對一致）"
      - state: date_claims_current_unverified
        meaning: "日期看起來新，內容有沒有真的對過帳未知"
    why_not_one_state: "把兩態合併成單一通過，正是這條規則要防的缺陷；一個被回報成通過的未知，比一個被回報成未知的未知更糟"

  evidence_admissibility:
    rule: "被提出作為本標準證據的檢查，必須已經被觀察到對一個刻意違反該要求的樣本回報失敗"
    why: "一支從未失敗過的檢查，與一支不可能失敗的檢查，輸出一模一樣"
    procedure_lives_in: class-level-fix
    exit_code_caveat_lives_in: verification-evidence

  anti_patterns:
    - pattern: "收件表單有三個以上必填欄位"
      why: "可量測地不再被使用；摩擦由正在打斷自己工作的人承擔"
    - pattern: "「之後再看」而沒有解除條件"
      why: "與被忘記無法分辨；沒有東西會讓它回來"
    - pattern: "手動輸入、重複 git 或 CI 已知資訊的狀態"
      why: "兩個擁有者，其中一個永遠不會被更新"
    - pattern: "沒有內容證明的「最後對過帳」日期"
      why: "內容真的被核對過，跟日期只是被打上去，看起來一模一樣"
    - pattern: "「還有 47 項」而不寫分母"
      why: "預設被讀成完整；看不見的大多數被誤讀成「都做完了」"
    - pattern: "確認點掛在 shell 啟動而不是回合結束"
      why: "只要沒人剛好開新 shell，它就持續漂移"
    - pattern: "確認點擋住回合結束、理由是「還有工作沒做完」"
      why: "每個回合都會觸發；永遠為真的閘門會被關掉，關掉之後什麼都不保護"
    - pattern: "分類狀態只靠散文措辭判讀"
      why: "正確到某個項目用清單沒預料到的方式寫出來為止"
    - pattern: "項目從承載庫無聲消失"
      why: "與一個弄丟它的 bug 無從分辨"
    - pattern: "目標或驗收條件被改了，卻沒有「誰同意」的紀錄"
      why: "「每一條驗收都滿足」依然為真，只是針對另一組條件；被改過的目標讀起來像一直這麼寫"
    - pattern: "把手寫的狀態檔當成版本控制或 CI 早已知道之事的真相"
      why: "會過期，而比過期內容新的戳看不見"
    - pattern: "下一步寫「繼續實作」或「處理剩下的」"
      why: "沒有點名任何可以開始的東西；與被遺忘的項目無從分辨"
    - pattern: "等待項目沒有任何「有沒有人問過」的紀錄"
      why: "沒人送出的草稿與沒人回的請求看起來一模一樣；等待永遠不會讓前者解除"
    - pattern: "手寫的「已寄出／已回覆／已核准」，沒有名字也沒有日期"
      why: "與猜測無從分辨，過期時也沒有任何東西顯示"
    - pattern: "一個沒有人能做的觀察，被算成「否」或已完成"
      why: "看不到的事實被讀成不存在或已完成；unknown 是一個值，不是零"
    - pattern: "對另一個專案的等待，用某一台機器的目錄記下來"
      why: "換一台機器就是錯的、洩漏使用者名稱，同一份載體的兩個讀者也不再指同一個專案"
    - pattern: "這台機器看不到的專案，被算成已解除或零"
      why: "沒看過的被讀成做完了；「從這裡看不到」是它自己的一個計數"
    - pattern: "等著另一個專案的工作，只放在某個人的 AI 工具記憶裡"
      why: "另一個 session 與 CI 讀不到，檢查也沒有任何具名的載體可以判定"

  rules:
    - id: OWT-001
      rule: "新項目的收件點必填欄位不得超過兩個；分類/優先級/負責人一律是 triage 時的動作，不得成為輸入門檻"
      severity: error
    - id: OWT-002
      rule: "標為等待中的項目，必須同時記下在等什麼與什麼事件視為解除"
      severity: error
    - id: OWT-003
      rule: "能從版控/規格標記/CI 結果完整推導的欄位，一律生成，不得手寫"
      severity: error
    - id: OWT-004
      rule: "生成區段的「最新」宣稱必須能從它所本的內容證明（例如來源雜湊），不能只靠一個人可編輯的日期"
      severity: error
    - id: OWT-005
      rule: "「內容可證明最新」與「日期宣稱最新、內容未驗證」須回報為兩個相異狀態；合併為單一通過即不滿足 OWT-004"
      severity: error
    - id: OWT-006
      rule: "任何「還有 N 項」的數字，須同時印出看得見多少來源、看不見多少來源；看不見的部分不得被讀成零"
      severity: error
    - id: OWT-007
      rule: "開放工作摘要出現在控制權從 agent 交回人的那一刻，不能只掛在 session 開始、CI、或追蹤文件被編輯時"
      severity: error
    - id: OWT-008
      rule: "開放工作摘要自己的結束路徑，不論輸入為何（含「還有很多項」）都不得改變回合的結果"
      severity: error
    - id: OWT-009
      rule: "摘要與一道阻斷式檢查掛同一個回合結束事件時，摘要的輸出須排在阻斷判決之前"
      severity: warning
    - id: OWT-010
      rule: "判定項目是等待中/未分類/已丟棄，須來自承載庫自定義的結構欄位，不得只靠掃描散文措辭"
      severity: error
    - id: OWT-011
      rule: "以措辭啟發式補充結構欄位時，須明示其涵蓋率未知，且其乾淨結果不得回報為「沒有漏掉」"
      severity: warning
    - id: OWT-012
      rule: "超過宣告門檻仍未分類的項目，須在開放工作摘要裡被個別點名，不得被合併進總數"
      severity: error
    - id: OWT-013
      rule: "項目從承載庫移除而未變成規格、追蹤項目、或任何其他具名去向時，須帶一句理由；沒有理由的移除與靜默刪除無法分辨"
      severity: error
    - id: OWT-014
      rule: "本標準的每一條要求都必須可表述為 artefact 之間可判定的關係；不能如此表述的要求不得進入本標準"
      severity: error
    - id: OWT-015
      rule: "被提出作為本標準任一要求之證據的檢查，須已被觀察到對一個刻意違反該要求的樣本回報失敗；從未紅過的檢查不是可採信的證據"
      severity: error
    - id: OWT-016
      rule: "本標準各要求所引用的任何窗口或閾值，須載明來歷，或標為未校準"
      severity: warning
    - id: OWT-017
      rule: "承載一件工作之目標／驗收條件／限制的載體，不同時承載它的進度或下一步，反之亦然；以走訪各載體的結構欄位判定，不看檔名；更新進度因此不需要碰目標"
      severity: warning
      severity_rationale: "分開存放只是手段：分開了卻沒有修訂紀錄（OWT-018）照樣漏，單一載體配上嚴格修訂紀錄照樣達成 OWT-018 的目的，所以違反的傷害是間接的"
    - id: OWT-018
      rule: "對一件工作的目標／驗收條件／限制的每一次修改，都留下「改了什麼、誰核可、為什麼」的紀錄；沒有核可者的修改須在控制權交回人時列出（OWT-007），不得靜默"
      severity: error
      severity_rationale: "失效是靜默的，而它只有一個時刻能被抓到——修改發生的那一刻；事後只剩被改過的文字可讀"
    - id: OWT-019
      rule: "「下一步」欄位至少點名一個具體對象：檔案路徑、測試名稱、指令或需求編號之一；只有動詞不算。判定的是有沒有點名對象，不是措辭好壞。處於 asked-awaiting 並滿足 OWT-022 的項目不在這裡判定：它的下一步可以就是它等的那個回覆，由 OWT-022 判定（何時問的、在等什麼、什麼事件解除它）"
      severity: warning
      severity_rationale: "「有點名對象」的結構檢查必然粗糙（被點名的對象仍可能無關），違反的代價是下一個工作階段的時間，不是工作本身"
    - id: OWT-020
      rule: "標為等待中的項目說明自己處於兩個狀態中的哪一個：not-yet-asked（請求已草擬或已決定要問，尚未送出）或 asked-awaiting（已送出、還沒有回音）；兩者皆非的等待項目，在開放工作摘要裡被個別點名，不被併入總數、不被算成已完成"
      severity: warning
      severity_rationale: "狀態詞與欄位名是第一版詞彙，沒有量測支持（OWT-016）；違反的代價是讀的人的時間。更嚴會讓所有早於這兩個狀態的載體在發布當天變紅"
    - id: OWT-021
      rule: "not-yet-asked 的項目點名那份草稿或那個動作（送出它就是解除條件）：檔案路徑、指令、測試名稱或需求編號之一（沿用 OWT-019 的辨認）"
      severity: warning
      severity_rationale: "與 OWT-019 同理：「有點名對象」的檢查必然粗糙，違反的代價是下一個工作階段的時間"
    - id: OWT-022
      rule: "asked-awaiting 的項目帶 asked-at（含年份的日曆日、不晚於今天），並滿足 OWT-002：在等什麼、什麼事件算解除"
      severity: warning
      severity_rationale: "asked-at 讓時鐘開始走；缺它的代價是項目沒有年齡、無法被門檻再次浮現，但不是工作本身遺失"
    - id: OWT-023
      rule: "手寫列只容許用在承載庫無法從版控、規格標記或 CI 結果推導的事實；每一列帶 observed-by（誰或什麼看到）、observed-at（含年份的日曆日、不晚於今天）與 yes／no／unknown 的值，缺任一項即違反。檢查只判定欄位存在且格式正確，絕不判定觀察為真"
      severity: warning
      severity_rationale: "這是對 OWT-003 的窄例外，詞彙未校準；它判定的是欄位存在，不是觀察誠實，所以違反的傷害是間接的"
    - id: OWT-024
      rule: "unknown 是值，不是空白：值為 unknown 的列在任何摘要裡單獨計數、單獨顯示，永遠不被算成完成；標為完成而值是 unknown 的列即違反"
      severity: warning
      severity_rationale: "OWT-006 的延伸（看不到的不是零）；詞彙未校準，故 warning"
    - id: OWT-025
      rule: "觀察的彙總顯示每筆觀察的年齡；超過宣告門檻的觀察回報為「觀察已舊」、另計、不被算成已確認。戳只說誰何時看到，不說現在仍然如此"
      severity: warning
      severity_rationale: "門檻的預設（7 天）是初始判斷，沒有量測支持（OWT-016）"
    - id: OWT-026
      rule: "OWT-023 的例外不及於版控、規格標記或 CI 結果已能決定的欄位；OWT-003 仍成立。檢查只能拿一份這類主題的詞表判定，其涵蓋率未知（OWT-011）"
      severity: warning
      severity_rationale: "判定靠措辭詞表，必然漏；乾淨的通過不代表沒有可推導的手寫列"
    - id: OWT-027
      rule: "等待項目的解除條件（OWT-002）可以點名另一個專案裡的物件，寫成 <專案>:<物件>。專案是邏輯名稱（uds、vibeops），不是目錄；物件是檔案路徑、測試名稱、指令或需求編號（OWT-019 的辨認）或版本控制標籤；載體裡沒有任何機器專屬的絕對路徑。名稱在某台機器上對應哪個目錄，宣告在載體之外。在等這種物件的項目沒有可被問的請求，所以 OWT-020 的兩個狀態不適用於它"
      severity: warning
      severity_rationale: "名稱樣式、機器專屬路徑前綴清單是第一版判斷（OWT-016），涵蓋率未知（OWT-011）；違反的代價是紀錄在另一台機器上失效，不是工作本身遺失"
    - id: OWT-028
      rule: "對每一個這樣的解除條件，檢查回報四種之一並單獨計數、絕不合併：已解除（該物件現在在對方專案裡存在）、尚未解除（專案看得到、物件不在）、從這裡看不到（這台機器看不到那個專案：不是已解除，也不是零）、需要人判斷（專案看得到，但這類物件——測試名稱、指令、需求編號——沒有任何檢查讀得到的東西）。查找只讀本機檔案與版本控制，不開任何網路連線"
      severity: warning
      severity_rationale: "OWT-006 的延伸（看不到的不是零）；能查找的物件種類只有路徑與標籤，是初始判斷（OWT-016）"
    - id: OWT-029
      rule: "等著另一個專案的工作，其紀錄是受版本控制、每個相關專案的 session 都讀得到的 repo 裡的一個檔案；不得只放在個人的 AI 工具記憶裡（它綁一個使用者、一台機器，另一個 session 與 CI 讀不到）。用哪個 repo 是採用專案的選擇。參考檢查不判定載體放在哪裡"
      severity: warning
      severity_rationale: "存放位置是採用專案的決定；違反的代價是另一個 session 看不到那份等待，但不是工作本身遺失"

  # ── 意圖 vs 進度（OWT-017／018／019）──────────────────────────────────────
  intent_vs_progress:
    intent: "目標、驗收條件、限制——說「完成」是什麼意思；很少改，只因某人決定而改"
    progress: "做到哪、還剩什麼、下一步、卡在哪——每個工作階段都在變，由做事的 agent 寫"
    form: "不限：規格檔搭配工作紀錄、或目標／狀態兩個檔都符合；判準是結構不是檔名"
    revision_record:
      fields: [what_changed, approver, reason]
      no_approver: "不禁止（agent 正當地會提出修改）；但要在控制權交回人時列出，且永不阻斷（OWT-008）"
      decidable_by_a_check: "意圖有沒有變、有沒有新增一筆紀錄、紀錄是否完整、核可者欄位有沒有填"
      not_decidable_by_a_check: "那筆紀錄是否誠實描述了這次修改——這是語意宣稱，不是 artefact 之間的關係（OWT-014）"
    next_action:
      names_one_of: [file_path, test_name, command, requirement_identifier]
      outcomes:
        - named_and_resolved
        - named_unresolved
        - unnamed   # 唯一的違反
        - waiting_on_reply   # 1.4.0：asked-awaiting 且 OWT-022 齊全；不是違反、不算已點名、不算完成
      waiting_on_reply:
        applies_when: "項目是 asked-awaiting，而且 OWT-020 與 OWT-022 對它沒有任何違反（asked-at 為含年份、不晚於今天的日期；寫了在等什麼；寫了解除事件）"
        judged_by: "OWT-022，不是 OWT-019；next-action 以 waiting 所用的同一個函式（同一個日期）讀該列的狀態，不另寫一份"
        reported_as: "單獨計數（計數行尾附 waiting-on-reply=N，N 為 0 時不印）、自己的一節（列名、年齡、在等什麼、解除條件）、不算已點名、不算完成"
        stale: "年齡超過宣告門檻者標為已舊；沿用 OWT-025 的預設 7 天（--stale-after 宣告），未校準；只標示，不影響結束碼"
        not_waived:
          - "沒有 asked-at、asked-at 不是日期、asked-at 在未來"
          - "沒寫在等什麼、沒寫解除事件"
          - "not-yet-asked（它的下一步是送出草稿，OWT-021 要求點名草稿）"
          - "其他狀態（含 waiting 卻沒說問過沒有）"
          - "寫成小節標題的下一步（沒有狀態欄的一列可言）"
          - "沒有狀態欄的載體（讀法與 1.3.0 完全相同）"
        invariant: "對任一列：waiting 判為 asked-awaiting 且沒有 OWT-020／OWT-022 違反 ⇔ next-action 判為 waiting-on-reply；waiting 對它報 OWT-022 時，next-action 不得免除它"
        exit_code_change: "含這種列的載體，next-action 對該列不再回 1（過去因未點名回 1）"
        not_decidable_by_a_check: "請求是否真的送出、是否仍未回覆——只判定欄位存在且格式正確（OWT-014，同 OWT-023）"
      coverage: "辨認路徑/指令/測試名稱/編號本身是樣式比對，涵蓋率未知（OWT-011）；認不出的格式回報為未點名"
      fields_read: "參考程序以同一份詞彙讀三種形狀：小節標題、行內標籤、表頭在詞彙內的表格欄（該欄每一列各算一個欄位）"
      ragged_table_row: "欄數與表頭不一致的列列為判定不了、不當成空白；別處沒有違反時結束碼為 2（不是通過）"
      empty_field: "空白、—、-、已完成的儲存格只計數不評估，不算違反（OWT-019 判斷寫了的下一步，沒寫是另一種失效）"

  # ── 兩個等待前狀態與助理看不到的事實（OWT-020～026，1.2.0）────────────────
  waiting_and_observed:
    states:
      not_yet_asked:
        meaning: "請求已草擬或已決定要問，尚未送出"
        must_name: "那份草稿或那個動作（檔案路徑、指令、測試名稱或需求編號；沿用 OWT-019 的辨認）"
        released_by: "送出"
      asked_awaiting:
        meaning: "已送出，還沒有回音"
        must_carry: [asked_at, waiting_for, release_event]   # 後兩者即 OWT-002
      neither: "標為等待卻不屬於這兩者：被個別點名（比照 OWT-012），不併入總數，不算已完成"
    observed_fact:
      admitted_only_for: "承載庫無法從版控、規格標記或 CI 結果推導的事實（例：是否已寄出、對方是否已回覆、是否已核准）"
      row_fields: [observed_by, observed_at, value]
      value_domain: [yes, no, unknown]
      unknown: "正式的值：單獨計數、單獨顯示、永遠不算完成；標為完成而值是 unknown 即違反"
      age: "每筆觀察顯示年齡；超過宣告門檻者為「觀察已舊」，另計，不算已確認"
      stamp_claims: "誰、何時看到；不宣稱現在仍然如此"
      not_reaching: "版控、規格標記或 CI 結果已能決定的欄位（OWT-003 仍成立）"
    decidable_by_a_check: "欄位是否存在、日期是否為含年份的真實日子且不晚於今天、值是否在值域內、年齡、狀態詞"
    not_decidable_by_a_check: "observed-by 填的是不是真的去看過的人、值是否為真、以及它現在是否仍然如此——這是關於世界的宣稱，不是 artefact 之間的關係（OWT-014）"
    coverage: "狀態詞與欄位名（中英文）、可推導主題詞表皆為措辭比對，涵蓋率未知（OWT-011）；沒有 observed-by 也沒有 observed-at 欄的表格不被讀成觀察載體"
    time: "今天的日期由 --now 注入，絕不在規則裡讀時鐘；門檻由 --stale-after 宣告，預設 7 天為未校準的初始判斷（OWT-016）"
    exit_codes: "任何違反（含 warning 等級）結束碼為 1；判定不了為 2（不是通過）"

  # ── 對另一個專案的等待（OWT-027～029，1.3.0）──────────────────────────────
  cross_project_waiting:
    reference_form: "<專案>:<物件>，專案是邏輯名稱（小寫字母、數字、- 與 _，以字母開頭，2 到 32 字元），物件是檔案路徑、測試名稱、指令、需求編號或版本控制標籤"
    carrier_must_not_hold: "機器專屬的絕對路徑（家目錄與磁碟區目錄、磁碟機代號、~/、UNC 路徑、file: URL）與離開該專案的路徑（..）"
    name_to_directory: "宣告在載體之外：參考檢查的 --root NAME=DIR（可重複，與單一 --root DIR 並存），或採用專案設定的 open_work.projects"
    answers: [released, not_yet_released, not_visible_from_here, needs_a_person]
    not_visible_from_here: "這台機器看不到該專案（沒有宣告目錄、目錄不存在、讀不到版本控制）：單獨計數，不是已解除，也不是零"
    machine_observable: "檔案路徑（存在與否）與版本控制標籤（存在與否）；其餘種類回報為需要人判斷"
    waiting_state: "在等另一個專案之物件的項目免於 OWT-020 的兩個狀態，單獨計數為 waiting-cross-project，仍被點名"
    record_location: "受版本控制、每個相關專案的 session 都讀得到的 repo；不得只放個人 AI 工具記憶；檢查不判定（OWT-029）"
    scope: "一個人在一台機器上的各個 session；跨人共享與共享紀錄的審核不在本版決定"
    decidable_by_a_check: "邏輯名稱樣式、有無機器專屬路徑、路徑或標籤在本機是否存在"
    not_decidable_by_a_check: "被點名的物件是不是對的那一個、測試或指令是否通過、紀錄存在哪個 repo、誰讀得到（OWT-014）"
    network: "不連網：只讀本機檔案與 git"

  # ── 「下一步」詞彙（461，併入 1.3.0，不新增要求編號）────────────────────────
  next_action_words:
    one_list: "一份清單，三種讀法（標題、表頭、行內標籤），沒有第二份；採用者宣告的詞併入同一份"
    built_in: ["next action／next step", "下一步", "下一動", "回來要做什麼", "下一個動作", "下一個步驟", "接下來要做什麼"]
    deliberately_absent: ["待辦", "後續", "Next", "TODO", "Action", "接下來"]
    why_absent: "這些詞也標在不是下一步的欄位上；讀成下一步會讓違反藏在一個從來不是下一步的欄位後面"
    declared_by_adopter: "--next-action-word WORD（可重複），或採用專案設定的 open_work.next_action_words；兩者合併"
    declared_word_is: "純文字、不分大小寫、子字串比對，不是正規表達式；空字串或只有空白被拒絕並說明，不被靜默忽略"
    exit_2_explains: "完全找不到欄位時結束碼仍是 2；訊息列出每個載體看到的表頭與標題（約 20 個）、認得的詞（宣告的另列）、怎麼加，並分辨「有表格但表頭都不符」與「沒有表格也沒有標題可讀」"
    uncalibrated: "內建清單與它拒絕收的詞都是初始判斷（OWT-016）"
    command_words:
      built_in_additions: ["glab", "dotnet"]
      deliberately_absent: ["go", "make", "sh"]
      declared_by_adopter: "--command-word PROGRAM（可重複），或採用專案設定的 open_work.command_words；next-action 與 waiting 都讀"
      rule: "一個程式名，純文字、區分大小寫、不是正規表達式；空白或含空格的詞被拒絕並說明"
    resolution_is_said:
      what: "next-action 說路徑是在哪個目錄下查找的、那個目錄從哪來（--root 或目前目錄），載體在 git repo 之外又沒給 --root 時明說"
      only_paths: "只有路徑會被查找；指令、測試名稱、需求編號只判定有沒有被指名，永遠不會是已解析"
      split: "named-unresolved 分成 path-missing（查過、不在）與 not-resolvable（從不查找）；兩者相加等於 named-unresolved，既有輸出行不變，只新增行"

  # ── 刻意不採納（來源：使用者轉貼的提示詞，作者不明，僅借設計形狀）──────────
  not_adopted:
    source: "使用者轉貼的提示詞，作者與出處不明、無實作；僅借設計形狀，不引用其任何宣稱"
    items:
      - what: "以手寫狀態檔作為任何「已有可靠來源可決定」之狀態的真相"
        why: "手寫狀態會過期，而戳比過期內容新是隱形的（OWT-004／005 的起因）；只說以版本控制為準卻沒有對帳機制，就是採納一個已知會過期的來源。OWT-003 已要求可推導的欄位改用生成。自 1.2.0 起有一個窄例外（OWT-023～026）：對沒有任何東西能推導的事實（訊息是否已寄出、對方是否已回覆），容許一列手寫——但必須附誰何時看到的戳記、值可以誠實是 unknown、且每份報告都顯示年齡，並且絕不及於版控、規格標記或 CI 結果已能決定的欄位。上面的反對理由是被回答了，不是被擱置：那個理由是過期看不見，而這裡年齡就印在每個值旁邊"
      - what: "固定的開工儀式（讀檔→查版本控制→驗證）"
        why: "交接點已由 OWT-007 與 turn-completion-integrity 管住；開工儀式要靠各代理工具自己的指示設定，寫進標準只會得到一條沒有任何 artefact 檢查判定得了的要求（違反 OWT-014）"

  # ── 本標準在 UDS 側沒有閘門，這件事被記錄而非被暗示 ──────────────────────
  enforcement:
    automated_gate: false
    reference_check:
      command: "uds open-work <next-action|revision|separation|waiting|observations|self-test>"   # 隨 npm 安裝包出貨，採用者不需要 clone
      path: cli/src/utils/open-work-tracking.mjs                              # 規則本體只有這一份
      repo_entry: scripts/check-open-work-tracking.mjs                        # 只在 UDS repo 副本裡的薄殼，不含規則
      next_action_options_1_4_0: "--now YYYY-MM-DD 與 --stale-after DAYS（與 waiting／observations 同義）；next-action 以 waiting 的同一個函式讀每一列的狀態"
      covers: [OWT-017, OWT-018, OWT-019, OWT-020, OWT-021, OWT-022, OWT-023, OWT-024, OWT-025, OWT-026, OWT-027, OWT-028]   # OWT-029 靠採用專案自己決定，檢查不判定
      status: "參考判定程序，作為 OWT-015 意義上的證據（已對違反樣本紅過）；不是閘門，未接進任何 UDS 發版閘門，因為 UDS 沒有承載開放工作的地方可供檢查"
    why_not: >
      依上面的寫法約束，UDS 陳述關係，有沒有東西判定它是採用專案的決定。
      UDS 不出貨承載開放工作的地方本身，只出貨要求它具備什麼性質的標準。
    what_it_does_instead: >
      OWT-014 保證這裡每一條「能」被判定；OWT-015 固定「一次判定要算數需要什麼」；
      OWT-005／OWT-011 固定「一次不完整的判定容許印出什麼」。
    honest_boundary: >
      一個採用本標準而什麼都沒建的專案並未違反它——但它同樣不能宣稱自己的開放工作
      承載庫具備這些性質，因為它沒有任何可採信的證據說明有。

  # ── 證據強度與校準：誠實標注，不誇大 ─────────────────────────────────────
  evidence_and_calibration:
    origin: "XSPEC-427（2026-09-23），一個採用專案同一天做出並實跑的參考實作"
    age_at_writing: "以小時計，單一使用者，單一 repo"
    what_this_supports: "R1–R6 的形狀——每一條都對應一個當天觀察到的失效或使用者原話描述的模式"
    what_this_does_not_support: "OWT-001 的「兩個欄位」與 OWT-012 的「兩週」這類具體閾值——這些是初始判斷，不是量測"
    added_in_1_1_0:
      origin: "DEC-122（2026-09-29）：一個採用專案裡，目標與進度沒分開、且一條驗收條件被改而無人核可紀錄；設計形狀借自使用者轉貼、作者不明的提示詞"
      uncalibrated_per_owt_016: "參考判定程序用的標題詞彙、指令名清單、副檔名清單、需求編號樣式——全是初始判斷，沒有對照真實使用量測；採用專案應傳入自己的"
    added_in_1_2_0:
      origin: "XSPEC-459（2026-10-07）：一個採用專案對 6.14.0-beta.5 的測試回報——草擬了從沒送出的訊息與已送出、沒人回的訊息分不出來；助理無法觀察的事實沒有被認可的存放處"
      uncalibrated_per_owt_016: "中英文的狀態詞與欄位名、被當成可推導的主題詞表、「觀察已舊」預設的 7 天、日期的讀法（必須有年份、時間不看）——全是初始判斷，沒有對照真實使用量測；參考判定程序只有幾小時大、跑過的是人造樣本"
    added_in_1_3_0:
      origin: "XSPEC-460／XSPEC-461（2026-10-07）：一個專案的項目在等另一個專案的產出，當時只有臨時約定；另有使用者的載體一個狀態一張表，next-action 回 2 卻沒說為什麼"
      uncalibrated_per_owt_016: "邏輯名稱樣式、機器專屬路徑前綴、能查找的物件種類（路徑與標籤）、「下一步」內建詞與它拒絕收的詞——全是初始判斷，沒有對照真實使用量測；參考判定程序只有幾小時大、跑過的是人造樣本"
    added_in_1_4_0:
      origin: "XSPEC-464（2026-10-07）：同一個採用專案對 6.14.0-beta.5 的測試——17 個下一步欄位中 14 個是「等對方回信／排時間／撤銷」，waiting 接受而 next-action 拒絕同一批列；該專案拒絕只為通過檢查而改寫載體"
      uncalibrated_per_owt_016: "「已舊」沿用 OWT-025 的 7 天預設（未經量測）、判定 asked-awaiting 的狀態詞（同 OWT-020）——全是初始判斷；只寫了解除條件、沒寫問的日期的載體，補上日期之前仍由 OWT-019 判定"
    recalibration: "由採用專案自行決定與自行訂定時程；本標準不承諾覆核日期，如同它不承諾閘門"

  related:
    - id: deferred-item-exit
      relation: "上游的同一個形狀：DEX 要求延後項目離開文件、抵達可追蹤出口，刻意不規定出口的載體。本標準接手出口存在之後的事，要求載體自己不要變成下一份東西會不見的文件"
    - id: turn-completion-integrity
      relation: "掛在同一個事件（回合結束）上，且被設計成行為相反——TCI 阻斷、本標準永不阻斷。見 vs_turn_completion_integrity"
    - id: class-level-fix
      relation: "OWT-011 揭露之措辭清單限制的通則形式，也是 OWT-015 所要求非空跑證據程序的來源"
    - id: verification-evidence
      relation: "OWT-015 所依賴的 exit code 與證據有效性推理的來源；也是 OWT-006／OWT-011 部分涵蓋例外該被登記的地方"

physical_spec:
  applies_to:
    - "任何承載跨回合/跨 session 開放工作的地方（收件匣、待辦清單、backlog、worklog 等，載體不限）"
  deliverables:
    - "收件點的欄位數（須 ≤ 2）"
    - "每個等待中項目旁的解除條件"
    - "生成區段旁的內容可證明性（而非僅時間戳）"
    - "任何「還有 N 項」數字旁的看見/看不見分母"
    - "掛在回合結束、永不阻斷的開放工作摘要"
    - "超過門檻仍未分類項目的個別點名，與已丟棄項目的一句理由"
    - "目標／驗收條件與進度／下一步分屬不同載體（以結構判定）"
    - "目標或驗收條件的每次修改對應一筆「改了什麼、誰核可、為什麼」紀錄；無核可者的修改在交回點被列出"
    - "每個「下一步」點名至少一個檔案路徑、測試名稱、指令或需求編號；已問、等回覆且 OWT-022 齊全的項目除外，它的下一步可以就是那個回覆（單獨列出、顯示年齡）"
    - "每個等待項目標明「還沒問」或「已問、等回覆」；還沒問的點名草稿，已問的帶 asked-at、等什麼與解除事件"
    - "助理看不到的事實的手寫列：observed-by、observed-at、yes／no／unknown 的值；unknown 與「觀察已舊」另計、永不算完成；每筆顯示年齡"
    - "等著另一個專案的項目用 <專案>:<物件> 點名，載體沒有機器專屬路徑；每個這樣的條件回報已解除／尚未解除／從這裡看不到／需要人判斷之一，看不到的單獨計數"
    - "等著另一個專案的工作，紀錄放在受版本控制、各方 session 都讀得到的 repo，不只放個人 AI 工具記憶"
