# 繁體中文提交格式 - AI 優化選項
# 父項: commit-message
#
# 2.0.0（XSPEC-475 OQ1）：類型使用英文（feat、fix……，與 english 選項相同），主旨與本文使用繁體中文。
# 2.0.0 之前本檔列的是中文類型（功能、修正……），與人類可讀版本及採用者 commitlint 的 type-enum 不一致；
# 現在不再允許中文類型。

id: traditional-chinese
meta:
  parent: commit-message
  version: "2.0.0"
  description: 英文類型加繁體中文主旨的提交訊息格式
  language: zh-TW

best_for:
  - 台灣或香港團隊
  - 使用繁體中文的專案
  - 文件以繁體中文為主的專案

format:
  template: "<type>(<scope>): <繁體中文主旨>"
  note: 類型使用英文（與 english 選項相同），範圍使用小寫英文或中文，主旨與內文可用繁體中文

types:
  - type: feat
    description: 新功能
    example: "feat(auth): 加入 OAuth2 登入"

  - type: fix
    description: 錯誤修正
    example: "fix(api): 處理空值回應"

  - type: refactor
    description: 程式碼重構（無功能變更）
    example: "refactor(core): 簡化驗證邏輯"

  - type: docs
    description: 僅文件更新
    example: "docs(readme): 更新安裝指南"

  - type: style
    description: 格式調整（無邏輯變更）
    example: "style(lint): 修正縮排"

  - type: test
    description: 新增或更新測試
    example: "test(auth): 新增登入單元測試"

  - type: perf
    description: 效能改善
    example: "perf(query): 最佳化資料庫查詢"

  - type: build
    description: 建置系統或相依套件
    example: "build(deps): 升級 lodash 至 4.17.21"

  - type: ci
    description: CI/CD 流程變更
    example: "ci(github): 新增程式碼覆蓋率工作流程"

  - type: chore
    description: 維護任務
    example: "chore(deps): 更新開發相依套件"

  - type: revert
    description: 還原先前提交
    example: "revert: feat(auth): 加入 OAuth2 登入"

  - type: security
    description: 安全漏洞修正
    example: "security(auth): 修正 XSS 漏洞"

rules:
  - id: english-type
    trigger: 撰寫提交標頭時
    instruction: 使用英文類型（feat、fix、docs 等）；不可使用中文類型（例如 新增）
    priority: required

  - id: chinese-subject
    trigger: 撰寫主旨時
    instruction: 以繁體中文撰寫主旨
    priority: recommended

  - id: chinese-body
    trigger: 撰寫內文時
    instruction: 以繁體中文撰寫內文
    priority: recommended

examples:
  simple: "feat(auth): 加入 OAuth2 登入支援"
  with_body: |
    feat(auth): 加入 OAuth2 Google 登入支援

    實作 Google OAuth2 認證流程供使用者登入。

    - 整合 Google OAuth2 SDK
    - 建立 OAuth 流程回呼端點
    - 安全儲存更新權杖

    關閉 #123
  breaking: |
    feat(api)!: 變更使用者端點回應格式

    破壞性變更: 使用者 API 回應格式已變更

    遷移指南：
    1. 更新 API 客戶端移除 .data 包裝
    2. 使用 created_at 取代 createdAt
