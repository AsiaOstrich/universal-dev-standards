# Traditional Chinese Commit Messages - AI Optimized Option
# Parent: commit-message
#
# 2.0.0 (XSPEC-475 OQ1): the TYPE is English (feat, fix, ...) exactly as in the english option; the SUBJECT (and the
# body) is Traditional Chinese. Before 2.0.0 this file listed Chinese types (新增, 修正, ...) while the human-readable
# option (options/commit-message/traditional-chinese.md) and every adopter's commitlint type-enum already used English
# types. A Chinese type is no longer allowed.

id: traditional-chinese
meta:
  parent: commit-message
  version: "2.0.0"
  description: English commit types with Traditional Chinese subjects, for local teams

best_for:
  - local teams in Taiwan
  - internal projects
  - teams preferring native language

format:
  template: "<type>(<scope>): <Traditional Chinese subject>"
  note: Type is English (same list as the english option); scope is lowercase English or Chinese; the subject and body may be Traditional Chinese

types:
  - type: feat
    description: New feature (新功能)
    example: "feat(auth): 加入 OAuth2 登入"

  - type: fix
    description: Bug fix (錯誤修正)
    example: "fix(api): 處理空值回應"

  - type: refactor
    description: Code refactoring, no functional change (程式碼重構)
    example: "refactor(core): 簡化驗證邏輯"

  - type: docs
    description: Documentation only (僅文件更新)
    example: "docs(readme): 更新安裝指南"

  - type: style
    description: Formatting, no logic change (格式調整)
    example: "style(lint): 修正縮排"

  - type: test
    description: Adding or updating tests (新增或更新測試)
    example: "test(auth): 新增登入單元測試"

  - type: perf
    description: Performance improvement (效能改善)
    example: "perf(query): 最佳化資料庫查詢"

  - type: build
    description: Build system or dependencies (建置系統或相依套件)
    example: "build(deps): 升級 lodash 至 4.17.21"

  - type: ci
    description: CI/CD pipeline changes (CI/CD 流程變更)
    example: "ci(github): 新增程式碼覆蓋率工作流程"

  - type: chore
    description: Maintenance tasks (維護任務)
    example: "chore(deps): 更新開發相依套件"

  - type: revert
    description: Revert a previous commit (還原先前提交)
    example: "revert: feat(auth): 加入 OAuth2 登入"

  - type: security
    description: Security vulnerability fix (安全漏洞修正)
    example: "security(auth): 修正 XSS 漏洞"

rules:
  - id: english-type
    trigger: writing commit type
    instruction: Use the English type from the types list (feat, fix, docs, ...); a Chinese type such as 新增 is not allowed
    priority: required

  - id: chinese-subject
    trigger: writing commit subject
    instruction: Write the subject in Traditional Chinese
    priority: recommended

  - id: chinese-scope
    trigger: writing commit scope
    instruction: Scope can be Chinese or English, but be consistent; English scope is lowercase
    priority: recommended

examples:
  simple: "feat(auth): 加入登入表單"
  with_body: |
    feat(auth): 加入 OAuth2 登入支援

    實作 Google OAuth2 認證流程。
    - 整合 Google OAuth2 SDK
    - 建立回呼端點
    - 安全儲存更新權杖

    關閉 #123
