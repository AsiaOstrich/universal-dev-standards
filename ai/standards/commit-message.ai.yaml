# Commit Message Guide - AI Optimized (v2 Dual-Layer)
# Source: core/commit-message-guide.md

standard:
  id: commit-message
  name: Commit Message Standards
  description: Conventional Commits format for standardized git commit messages
  guidelines:
    - "Use Conventional Commits format: <type>(<scope>): <subject>"
    - "Use imperative mood in subject (add, fix, not added, fixed)"
    - "Keep subject line under 72 characters"
    - "Use lowercase for scope"
    - "Reference issue numbers in footer"

  meta:
    version: "2.1.0"
    updated: "2026-10-12"
    source: core/commit-message-guide.md
    description: Conventional Commits format for standardized git commit messages

  format:
    template: |
      <type>(<scope>): <subject>

      <body>

      <footer>
    components:
      - name: type
        required: true
        description: Type of change
      - name: scope
        required: false
        description: Module/component affected
      - name: subject
        required: true
        description: Brief description (max 72 chars)
      - name: body
        required: false
        description: Detailed explanation
      - name: footer
        required: false
        description: Issue references, breaking changes

  decision:
    question: "What is your team composition?"
    matrix:
      - answer: "International or mixed team"
        select: english
      - answer: "Local team (Taiwan)"
        select: traditional-chinese
      - answer: "Mixed with local focus"
        select: bilingual

  options:
    output_language:
      default: english
      deprecated_aliases: [commit_language]
      shared_with: documentation-writing-standards
      choices:
        - id: english
          file: options/commit-message/english.ai.yaml
        # 1.4.0 of the guide (XSPEC-475): traditional-chinese = English type + Traditional Chinese subject and body.
        - id: traditional-chinese
          file: options/commit-message/traditional-chinese.ai.yaml
        - id: bilingual
          file: options/commit-message/bilingual.ai.yaml

  rules:
    - id: choose-language
      trigger: starting a project
      instruction: Choose ONE commit message language and document in CONTRIBUTING.md
      priority: required
    - id: consistent-language
      trigger: writing commit message
      instruction: Use the same language consistently across all commits
      priority: required
    - id: english-type
      trigger: choosing the commit type under any language option
      instruction: >-
        The type is always an English word from the chosen option's list (feat, fix, docs, ...), also under
        traditional-chinese, where only the subject and body are Traditional Chinese (feat(auth): 加入 OAuth2 登入).
        A Chinese type such as 新增 is not allowed. Migration from guide versions before 1.4.0:
        新增->feat, 修正->fix, 重構->refactor, 文件->docs, 樣式->style, 測試->test, 效能->perf, 建置->build,
        整合->ci, 維護->chore, 回退->revert, 安全->security.
      priority: required
    - id: subject-max-length
      trigger: writing commit subject
      instruction: Keep subject line under 72 characters
      validator: "^.{1,72}$"
      priority: required
    - id: scope-lowercase
      trigger: specifying scope
      instruction: Use lowercase for scope (auth, not Auth)
      validator: "^[a-z][a-z0-9-]*$"
      priority: required
    - id: imperative-mood
      trigger: writing commit subject
      instruction: Use imperative mood (add, fix, not added, fixed)
      priority: required
      examples:
        good:
          - "feat(auth): add OAuth2 login"
          - "fix(api): handle null response"
        bad:
          - "feat(auth): added OAuth2 login"
          - "fix(api): handles null response"
    - id: no-mixed-changes
      trigger: committing code
      instruction: One commit per logical change; avoid mixing unrelated changes
      priority: required
    - id: reference-issues
      trigger: fixing bugs or implementing features
      instruction: Reference issue numbers in footer
      priority: recommended
      examples:
        good:
          - "Closes #123"
          - "Fixes #456"
          - "Refs #789"

physical_spec:
  type: custom_script
  validator:
    command: "test -f commitlint.config.js || test -f .commitlintrc.js || test -f .commitlintrc.json"
    rule: "commitlint_config_exists"
  # XSPEC-456 R2: judged by the CLI itself from this file's own rules (header format, the types in
  # options/commit-message, rules scope-lowercase and subject-max-length). It used to pipe the message
  # into `npx commitlint`, which needs the network and a commitlint config, and answered "failed" for a
  # compliant message when the config was missing.
  simulator:
    type: builtin
    judge: commit-message

enforcement:
  # 🔴 hook_type was "PreCommit" — Claude Code has no such event — and the
  # trigger was UserPromptSubmit, so the validator ran on every prompt and
  # exited 1 every time. It belongs on the Bash call that makes the commit.
  hook_type: PreToolUse
  trigger: PreToolUse
  matcher: Bash
  script_ref: "scripts/hooks/validate-commit-msg.mjs"
  hook_script: "scripts/hooks/validate-commit-msg.mjs"
  severity: error
  timeout_ms: 500