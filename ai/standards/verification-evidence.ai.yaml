# Verification Evidence Standard - AI Optimized
# Source: core/verification-evidence.md
# Inspired by Superpowers verification-before-completion (MIT)

standard:
  id: verification-evidence
  name: Verification Evidence Standard
  description: 驗證證據標準，強化 anti-hallucination

  meta:
    version: "1.4.0"
    updated: "2026-11-28"
    source: core/verification-evidence.md
    description: >
      驗證證據標準 — Iron Law: 無驗證證據不可聲稱完成。
      v1.1.0: Evidence must specify which environment layer it was collected from (XSPEC-204).
      v1.2.0: Evidence itself must be validated — a tool can fail silently and its
      output is indistinguishable from a real result (XSPEC-340).
      v1.3.0: Evidence must postdate the last edit to what it verifies (VE-011,
      stale evidence); a documented coverage gap must be registered in a dated
      exception inventory, not left as prose alone (VE-012, narrow-coverage
      registration — shared with class-level-fix).
      v1.4.0: A claim that influences a decision is judged by a non-author, never by
      its own author (VE-013 to VE-020, XSPEC-432): three outcomes, no padding,
      known-false memory, re-runnable records, an author may not weaken their own
      judge, judges are calibrated first, one success is not stability.
    inspired_by: superpowers/verification-before-completion

  guidelines:
    - "Iron Law：無驗證證據 = 不可聲稱完成"
    - "每次驗證必須記錄 command + exitCode + output + timestamp"
    - "Iron Law（Environment）：驗收前必須確認「此環境層次能驗證此流程的哪些維度」"
    - "驗收證據必須標明收集自哪個環境層次（local / UAT / PRD）"
    - "回歸測試必須展示 RED → GREEN 循環"
    - "代理報告 success ≠ 實際 success，需獨立驗證"
    - "**工具回報 success ≠ 實際 success**——驗證指令本身可能沒跑起來，而其輸出與真結果無法區分"
    - "驗證輸出截斷至合理長度（2000 字元）但保留關鍵資訊"
    - "**證據必須晚於它所驗證對象的最後一次編輯**——最近一次執行剛好通過，不代表它驗證的是現狀（VE-011）"
    - "**窄涵蓋必須登記，不能只揭露**——文件化的證據/涵蓋缺口須登記到帶到期日的例外清冊，單純寫下來不算滿足（VE-012）"
    - "**宣稱的作者不是它的裁判**——影響決策的主張須由非作者裁決：優先確定性工具；無工具時交給不帶作者脈絡、被要求「試圖推翻」的全新 agent；作者自我複查不算裁決（VE-013）"
    - "**裁決結果只有三種：證實／推翻／無法判斷**；無法判斷不得被計為為假或通過（VE-014）"
    - "**作者不得修改自己的裁判**——新增斷言一律允許；刪除、放寬、跳過由非作者（人）裁決（VE-018）"

  # 以下不構成驗證證據。原本只存在於 zh-TW 譯文裡（英文來源與本檔皆無）——
  # v1.2.0 一併升上來源與本檔（XSPEC-340 R4：譯文比來源更完整，且無 gate 會報）。
  non_evidence_claims:
    - claim: "「已完成」"
      why: "無可觀察的輸出"
    - claim: "「應該可以了」"
      why: "未執行驗證"
    - claim: "「我改了程式碼」"
      why: "修改 ≠ 驗證"
    - claim: "「測試應該會通過」"
      why: "預測 ≠ 事實"
    - claim: "「指令回傳 0」"
      why: "僅當該指令確實可能量到該主張時才算——見 evidence_validity"

  # ── v1.2.0 證據有效性（XSPEC-340）──
  # Iron Law 擋的是「沒有證據就宣稱完成」。這一層擋的是相反的失敗：
  # 證據有、指令跑了、exit_code 是 0，**而那個輸出毫無意義**，因為指令根本沒量到東西。
  # 這不是幻覺（幻覺是「沒查就編」，anti-hallucination 已涵蓋）——這裡什麼都沒編，
  # 是**查了，而查詢工具騙了你**。
  evidence_validity:
    description: "證據本身是否成立——驗證指令是否真的執行、是否真的量到它宣稱的東西"
    rules:
      - name: "exit_code 的語意依工具而定"
        detail: >
          exit_code = 0 代表成功，只在「該工具成功時回 0」的前提下成立。
          當工具在受測狀態下**設計上就會失敗**時，其非 0 不帶有關於受測物的任何資訊——
          改看輸出內容。反向亦然：非 0 不足以證明受測物壞了。
      - name: "空輸出 / 查無 / 0 ≠ 不存在"
        detail: >
          斷言「不存在」之前，須先確立查詢工具**執行成功**：不是 command not found、
          不是權限不足、參數沒有被中間的 shell 吃掉。**查無之前，先確認查詢工具有在運作。**
      - name: "判斷存在與否的指令不得丟棄 stderr"
        detail: >
          抑制 stderr（`2>/dev/null` 及等價作法）消掉的正是「這個工具壞了」的那條通道，
          於是失敗會穿上與真陰性一模一樣的外衣。
      - name: "管線的 exit code 不屬於其中任何單一階段"
        detail: >
          `set -o pipefail` 下 `producer | grep -q pattern` 會繼承 producer 的非 0，
          grep 中不中都無關。需要依內容決策時：**先接住輸出，再判斷**。
      - name: "證據必須晚於它所驗證對象的最後一次編輯"
        detail: >
          在受測程式碼、提示詞或設定的最近一次變更之前擷取的驗證執行，證明的是別的東西——
          不是正在被主張的那件事。陷阱是靜默的：完整套件先跑過且全綠，之後才編輯了某個東西
          （提示詞、設定檔、門檻），編輯之後只跑了範圍更窄的檢查（lint、部分套件），
          結果卻拿更早的那次綠燈當作現狀的證據。**證據必須是最後一次編輯之後的單一次新鮮執行，
          不是「剛好通過的最近一次執行」。**（VE-011）
    provenance: >
      規則 1–4 的證據來自 2026-07-17 單一 agent（Claude Opus 4.8）單日的十次實例，
      記錄於 AsiaOstrich XSPEC-340；其中 exit_code=0 四次為假、exit_code≠0 兩次為真
      且依 VE-002 行動摧毀了健康的產物。樣本密集但來源單一——然而每個失敗都源自
      **工具本身的語意**（sudo / gpg / pipefail / POSIX exit code）而非模型的性質，
      故任何驅動同一批工具的 agent 都暴露在同樣的陷阱下。規則 5（VE-011）為獨立補強，
      非同一批樣本：其失效樣態為「完整套件跑過通過 → 之後改了提示詞/設定 →
      只跑範圍更窄的檢查（如 lint）就提交 → CI 紅在釘住新內容雜湊的測試」——
      通過的是「最後一次變更之前」的套件。

  evidence_format:
    fields:
      - name: command
        type: string
        required: true
        description: "實際執行的驗證指令"
      - name: exit_code
        type: number
        required: true
        description: "指令退出碼（0 = 成功）"
      - name: output
        type: string
        required: true
        description: "驗證輸出（截斷至 2000 字元）"
      - name: timestamp
        type: string
        required: true
        description: "執行時間（ISO 8601 格式）"
      - name: environment_layer
        type: string
        required: false
        description: >
          收集證據的環境層次（local / uat / prd）。
          對有外部服務依賴的功能為必填——缺少此欄位時，該 AC 的驗收等級視為 local-only。
        example: "uat"
      - name: subject_fingerprint
        type: string
        required: false
        description: >
          被檢物的指紋（內容雜湊、修訂版本號；工具版本也值得記）。
          對「影響決策且依 VE-013 裁決」的主張為必填，其餘情況選填（VE-017）。
        example: "commit 9f3c2ab"
      - name: rerun_method
        type: string
        required: false
        description: >
          第三方如何重跑這項檢查、不必信任本記錄就能得到結果（指令或精確步驟）。
          與 subject_fingerprint 同條件必填（VE-017）。
        example: "git checkout 9f3c2ab && npm test"

  red_green_cycle:
    description: "回歸測試的 RED → GREEN 驗證"
    steps:
      - "RED: 在修復前執行測試，確認測試確實失敗"
      - "修復問題"
      - "GREEN: 再次執行測試，確認測試通過"
      - "記錄 RED 和 GREEN 兩個階段的證據"

  trust_rules:
    - "代理聲稱「已完成」→ 檢查 verification_evidence 是否存在"
    - "verification_evidence 為空 → 標記為未驗證"
    # v1.2.0 修訂：原文為「exit_code ≠ 0 → 標記為驗證失敗」，無條件成立。
    # 該規則在 2026-07-17 兩次把**完全正常**的加密備份判為失敗並刪除——
    # 主機依設計不存私鑰，gpg 對正常檔案必然回非 0。故加上前提。
    - "exit_code ≠ 0 → 標記為驗證失敗——**除非**該工具在受測狀態下設計上就回非 0（見 VE-007），此時改依輸出內容判斷"
    - "exit_code = 0 但該指令不可能量到它宣稱的東西 → 標記為未驗證"
    - "證據斷言「不存在」（0／空／查無）→ 未證明查詢工具執行成功前，標記為未驗證"
    - "證據的時間戳早於它所驗證對象的最後一次編輯 → 標記為過期（stale），須在編輯後重跑，不得引用更早那次通過"
    - "影響決策的主張只有作者自己的話或自我複查 → 結果為無法判斷（見 VE-013），不得算通過"
    - "多個驗證步驟 → 所有步驟都必須通過"

  rules:
    - id: VE-001
      trigger: "代理回報 success 但無 verification_evidence"
      action: "降級為 done_with_concerns"
      priority: critical
    - id: VE-002
      trigger: "exit_code ≠ 0"
      action: >
        標記驗證失敗，啟動 fix loop——**前提是已確認該工具在此狀態下成功時回 0**（見 VE-007）。
        未確認就啟動 fix loop 等於對健康的產物動手。
      priority: high
    - id: VE-003
      trigger: "Bug fix 無 RED-GREEN 循環"
      action: "要求提供 RED 和 GREEN 兩階段證據"
      priority: high
    - id: VE-004
      trigger: "驗證輸出超過 2000 字元"
      action: "截斷但保留錯誤訊息與摘要行"
      priority: medium

  environment_rules:
    - id: VE-005
      trigger: "AC 涉及外部服務依賴（SMS、金流、IdP）"
      action: >
        驗收證據必須標明 environment_layer。
        local-only 證據對此類 AC 不足——需確認 UAT 或 PRD 層次的驗證計畫。
      priority: required
    - id: VE-006
      trigger: "有外部服務依賴的 AC 標記為 done，但無 environment_layer"
      action: >
        降級為 done_with_concerns。
        要求補充環境層次聲明，或在 environment-stratification-matrix 中標記為 ⚠️/❌。
      priority: high

  # ── v1.2.0 證據有效性規則（XSPEC-340）──
  validity_rules:
    - id: VE-007
      trigger: "驗證工具在受測狀態下**依設計**回非 0（例：主機刻意不存私鑰時的 gpg --list-packets）"
      action: >
        VE-002 不適用。改依輸出內容判斷；**不得對健康的產物啟動 fix loop**。
      priority: critical
    - id: VE-008
      trigger: "證據斷言「不存在」（exit_code 0、輸出為 0／空／查無）"
      action: >
        該證據不成立，直到證明查詢工具本身執行成功（非 command not found、非權限失敗、
        參數未被上游 shell 吃掉）。重跑且不抑制 stderr。
      priority: high
    - id: VE-009
      trigger: "判斷存在與否的驗證指令抑制了 stderr（`2>/dev/null` 或等價作法）"
      action: "證據不成立。以可見 stderr 重跑。"
      priority: high
    - id: VE-010
      trigger: "證據的 exit_code 來自管線（尤其在 `set -o pipefail` 下）"
      action: "該 exit code 不歸屬於任何單一階段。先接住輸出，再依內容判斷。"
      priority: medium
    - id: VE-011
      trigger: "證據的執行時間戳早於它所宣稱驗證之產物的最後一次編輯"
      action: >
        標記為過期（stale）——對現狀不成立為證據；要求在編輯後補一次單一次新鮮執行。
      priority: high

  # ── v1.3.0 窄涵蓋登記規則（B-01 借鑒）──
  # 與 class-level-fix 的同名規則共用同一條要求：文件化的缺口若沒有登記到
  # 帶到期日的例外清冊，揭露就會變成永久豁免。
  narrow_coverage_registration:
    description: "文件化的證據/涵蓋缺口（environment-stratification ⚠️/❌、或任何窄於其主張的檢查）必須登記，不能只揭露"
    requirement: >
      任何這一類已記錄的缺口，須同時登記到一份帶到期日的例外清冊——獨立於標準本文或
      matrix 條目本身之外——指名缺口、其成因、並附上覆核或到期日期。只有一則註腳而沒有
      對應清冊條目，不滿足此規則。
    falsifiable_condition: >
      一則清冊條目連續兩期審查都未變動，代表該揭露已經變成逃生口，本條對該條目失效——
      不是「部分滿足」，是失效。清冊放在哪裡、什麼格式、多久審一次，留給採用專案自行決定；
      本標準只要求「有這麼一份東西存在，且條目會動」。
    shared_with: class-level-fix
    rules:
      - id: VE-012
        trigger: "文件化的證據/涵蓋缺口（environment-stratification ⚠️/❌，或任何窄於其主張的檢查）沒有登記到帶到期日的例外清冊"
        action: "揭露本身不滿足此規則——要求一則登記過、帶到期日的清冊條目，指名缺口與其覆核/到期日期"
        priority: required

  # ── v1.4.0 非作者裁決（XSPEC-432 R1 / DEC-104；R1 第 6、7 條來自 DEC-106，第 8 條來自 DEC-107）──
  # Iron Law 問「有沒有證據」，證據有效性問「證據成不成立」；兩者都沒問「誰決定證據撐得起主張」。
  # 寫下主張的那一位若同時讀證據並宣布足夠，主張就只有一個證人，而那位證人與答案有利害關係。
  # 只訂原則：哪個工具、哪個 agent、哪個模型、門檻數字，都留給採用端決定。
  non_author_adjudication:
    description: "影響決策的主張（檔案存在、測試通過、沒有這個漏洞、已完成）由非作者裁決"
    outcomes:
      - name: confirmed
        zh: "證實"
        meaning: "裁決者檢視了實物，主張成立"
        maps_to: "證據成立，不降級"
      - name: refuted
        zh: "推翻"
        meaning: "裁決者檢視了實物，主張不成立"
        maps_to: "驗證失敗——前提是 VE-007 已確認工具健康"
      - name: undecidable
        zh: "無法判斷"
        meaning: "裁決者無法判斷"
        maps_to: "未驗證、過期（stale）"
        never_recorded_as: ["false", "absent", "passed"]
        always_when: ["查詢工具故障", "裁決者自身發生錯誤"]
    adjudicator_order:
      - "確定性工具（測試執行器、型別檢查、檔案系統查詢）"
      - "不帶作者脈絡、被明確要求試圖推翻主張的全新 agent"
    not_adjudication: "作者自我複查——可作為預檢，但不算裁決"
    rules:
      - id: VE-013
        trigger: "影響決策的主張只由其作者（或作者的自我複查）裁決"
        action: >
          結果為無法判斷。要求確定性工具，或不帶作者脈絡、被要求試圖推翻的全新 agent。
        priority: critical
      - id: VE-014
        trigger: "記錄裁決結果"
        action: >
          只有證實／推翻／無法判斷三種。無法判斷不得記為為假、不存在或通過；
          查詢工具故障與裁決者自身錯誤一律歸無法判斷。
        priority: critical
      - id: VE-015
        trigger: "一組主張全部證實"
        action: >
          不等於通過：可由已知資訊推得的、重複的、自我指涉的主張不計入；
          至少須有一項實質主張被證實。何謂實質、需要幾項，由採用端定義。
        priority: high
      - id: VE-016
        trigger: "被推翻的主張被再次提出，或已證實主張的被檢物已變動"
        action: >
          被推翻的主張保留為已知為假並附被檢物指紋；指紋未變前不得以相同主張重提
          （換措辭也不行）；依賴被推翻主張的主張連帶作廢；已證實的主張在被檢物指紋
          變動後須重驗。
        priority: high
      - id: VE-017
        trigger: "依 VE-013 裁決的主張，其證據缺 subject_fingerprint 或 rerun_method"
        action: "要求兩者皆有，讓第三方可重跑而非信任結論"
        priority: required
      - id: VE-018
        trigger: "裁判（測試、斷言、驗收情境、檢查器）的作者刪除、放寬或跳過其中一部分"
        action: >
          作者不得自行採納，須由非作者（人）裁決。新增斷言與驗收情境一律允許。
        priority: critical
      - id: VE-019
        trigger: "引用某驗證機制的通過結果當證據，但它從未被證明抓得到錯"
        action: >
          先在拋棄式複本注入已知錯誤，確認機制抓得到。每個錯記為 caught／escaped／
          undecidable；錯誤沒有實際注入成功判無法判斷，不得判通過；記錄每個錯由哪一層
          抓到——瞄準某層的錯須對更早的層不可見，否則是在重複量更早那一層。
        priority: high
      - id: VE-020
        trigger: "宣稱「穩定」「可靠」「會成功」"
        action: >
          須附 k 次重跑全數成功的結果並寫出 k；單次成功或只報平均成功率不支持該詞，
          判無法判斷；重跑中有成有敗記為「不穩定」，不得計為通過。k 由採用端決定。
        priority: high
    not_decided_here:
      - "用哪個工具、哪個 agent、哪個模型——原則是誰裁決，不是用什麼裁決"
      - "VE-015 的「實質」與 VE-020 的 k 的數值——寫死的數字只貼合某一個專案的證據"
      - "裁決者本身一定對——全新 agent 也可能錯，所以才有 VE-019 先校正"

physical_spec:
  type: checklist
  validator:
    type: ai_review
    rule: "檢查任務完成是否附帶驗證證據（command + exit_code + output + timestamp + environment_layer）"
  checks:
    - "完成聲明是否附帶 verification_evidence"
    - "evidence 是否包含所有必填欄位"
    # v1.2.0 修訂：原文為「exit_code 是否為 0（成功）」——它把 0 直接等同於成功，
    # 正是 XSPEC-340 §A 十個實例中四次誤報的來源。
    - "exit_code 是否為 0——且**該工具成功時確實回 0**（見 VE-007）"
    - "證據若斷言「不存在」，是否已證明查詢工具執行成功（VE-008）"
    - "判斷存在與否的指令是否抑制了 stderr（VE-009）"
    - "exit_code 是否來自管線而非受測指令本身（VE-010）"
    - "證據的執行時間戳是否晚於它所驗證對象的最後一次編輯（VE-011）"
    - "文件化的證據/涵蓋缺口是否登記於帶到期日的例外清冊，而非只有揭露文字（VE-012）"
    - "影響決策的主張是否由非作者裁決，而非作者自述或自我複查（VE-013）"
    - "裁決結果是否只有證實／推翻／無法判斷，且無法判斷未被記為為假或通過（VE-014）"
    - "「全部證實」是否含至少一項實質主張，而非只有可推得、重複或自我指涉的主張（VE-015）"
    - "被推翻的主張是否保留為已知為假並附指紋，已證實的主張在被檢物變動後是否重驗（VE-016）"
    - "依 VE-013 裁決的主張是否附 subject_fingerprint 與 rerun_method（VE-017）"
    - "裁判是否被其作者刪除、放寬或跳過而未經非作者裁決（VE-018）"
    - "引用的驗證機制是否先注入已知錯誤證明抓得到（VE-019）"
    - "「穩定」「可靠」的宣稱是否附 k 次重跑全數成功並寫出 k（VE-020）"
    - "Bug fix 是否有 RED → GREEN 循環證據"
    - "有外部服務依賴的 AC 是否標明 environment_layer"
