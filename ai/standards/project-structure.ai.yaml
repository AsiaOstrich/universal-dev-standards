# Project Structure Standard - AI Optimized (v2 Dual-Layer)
# Source: core/project-structure.md

standard:
  id: project-structure
  name: Project Structure Standard
  description: Conventions for project directory structure
  
  guidelines:
    - "Always gitignore build output directories (dist/, build/, out/, bin/)"
    - "Follow language-specific conventions for src/ structure"
    - "Place tests in tests/ or alongside source (language-dependent)"
    - "Group scripts in tools/ with subdirectories by purpose"

  meta:
    version: "2.0.0"
    updated: "2026-03-04"
    source: core/project-structure.md
    description: Conventions for project directory structure

  options:
    project_language:
      description: Choose project language/platform
      choices:
        - id: dotnet
          file: options/project-structure/dotnet.ai.yaml
        - id: nodejs
          file: options/project-structure/nodejs.ai.yaml
        - id: python
          file: options/project-structure/python.ai.yaml
        - id: java
          file: options/project-structure/java.ai.yaml
        - id: go
          file: options/project-structure/go.ai.yaml
        - id: rust
          file: options/project-structure/rust.ai.yaml
        - id: kotlin
          file: options/project-structure/kotlin.ai.yaml
        - id: php
          file: options/project-structure/php.ai.yaml
        - id: ruby
          file: options/project-structure/ruby.ai.yaml
        - id: swift
          file: options/project-structure/swift.ai.yaml

  structure:
    common:
      - dir: src/
        purpose: Source code
        gitignore: false
      - dir: tests/
        purpose: Test files
        gitignore: false
      - dir: docs/
        purpose: Documentation
        gitignore: false
      - dir: tools/
        purpose: Development/deployment scripts
        gitignore: false
        subdirs: [deployment/, migration/, scripts/]
      - dir: examples/
        purpose: Usage examples
        gitignore: false

    build_output:
      - dir: dist/
        purpose: Distribution output
        gitignore: true
      - dir: build/
        purpose: Compiled artifacts
        gitignore: true
      - dir: out/
        purpose: Output directory
        gitignore: true
      - dir: bin/
        purpose: Binary executables
        gitignore: true

    config:
      - dir: .github/
        purpose: GitHub configs
        gitignore: false
      - dir: .standards/
        purpose: Development standards
        gitignore: false
      - dir: config/
        purpose: Configuration files
        gitignore: false

  rules:
    - id: gitignore-build
      trigger: creating project
      instruction: Always gitignore build output directories (dist/, build/, out/, bin/)
      priority: required
    - id: src-structure
      trigger: organizing source code
      instruction: Follow language-specific conventions for src/ structure
      priority: required
    - id: tests-location
      trigger: organizing tests
      instruction: Place tests in tests/ or alongside source (language-dependent)
      priority: recommended
    - id: tools-organization
      trigger: adding scripts
      instruction: Group scripts in tools/ with subdirectories by purpose
      priority: recommended
    - id: shared-code-directories
      trigger: placing shared or utility code
      instruction: Choose the directory by purpose (see source_code_organization); prefer shared/ over its alias common/
      priority: recommended
    - id: config-placement
      trigger: adding configuration files
      instruction: Tool configs at project root, app runtime configs in config/ or src/config/, secrets only in gitignored .env files (see config_placement)
      priority: required
    - id: generated-code-placement
      trigger: adding generated code
      instruction: Keep generated code apart from hand-written code under src/generated/; never edit generated files (see generated_code)
      priority: required

  source_code_organization:
    directories:
      - { dir: utils/, purpose: "Pure utility functions", use_when: "Stateless, no business logic, cross-module reusable", reusable_scope: Global }
      - { dir: helpers/, purpose: "Context-specific assistants", use_when: "Bound to a specific layer (test, view, controller)", reusable_scope: Layer-specific }
      - { dir: shared/, purpose: "Cross-module shared code", use_when: "Used by 2+ modules, may have a package boundary", reusable_scope: Cross-module }
      - { dir: common/, purpose: "Alias for shared/", use_when: "Less recommended; use shared/ instead", reusable_scope: Cross-module }
      - { dir: lib/, purpose: "Wrapped or vendored libraries", use_when: "Wrapping third-party dependencies, internal libraries", reusable_scope: Project-wide }
      - { dir: internal/, purpose: "Private module code (Go convention)", use_when: "Module internals not exposed to consumers", reusable_scope: Package-internal }
    decision_flow:
      - "Stateless and no business logic and reusable across the whole project -> utils/"
      - "Stateless and no business logic but tied to a layer (tests, views) -> helpers/ (e.g. tests/helpers/)"
      - "Stateless and no business logic, otherwise -> place it in the module that uses it"
      - "Not stateless-and-logic-free: used by 2+ modules -> shared/"
      - "Not used by 2+ modules but wraps a third-party dependency -> lib/"
      - "Otherwise -> place it in the owning module"

  config_placement:
    locations:
      - { category: Root configs, location: "Project root /", examples: "package.json, tsconfig.json, pyproject.toml, .eslintrc.json" }
      - { category: App configs, location: "config/ or src/config/", examples: "Database config, feature flags, app settings" }
      - { category: Environment, location: ".env files (gitignored)", examples: ".env, .env.local, .env.production" }
      - { category: CI/CD, location: ".github/workflows/ or .gitlab-ci.yml", examples: "CI pipeline definitions" }
      - { category: Infrastructure, location: "infra/ or deploy/", examples: "Terraform, Kubernetes manifests, Docker Compose" }
      - { category: IDE/Editor, location: "Root (mostly gitignored)", examples: ".vscode/, .idea/, .editorconfig" }
    decision_rules:
      - "Tool configs -> project root (tools expect them there)"
      - "App runtime configs -> config/ or src/config/"
      - "Secrets -> .env files, always gitignored"
      - "CI/CD -> platform-specific directory (.github/, .gitlab/)"
      - "Infrastructure as Code -> infra/ or deploy/"

  generated_code:
    locations:
      - { type: API client stubs, location: src/generated/, gitignore: "Depends on workflow" }
      - { type: Protobuf/gRPC, location: src/generated/proto/, gitignore: "Yes (regenerated from .proto)" }
      - { type: Database types (ORM), location: src/generated/db/, gitignore: "Depends on ORM" }
      - { type: OpenAPI types, location: src/generated/api/, gitignore: "Depends on workflow" }
      - { type: Build artifacts, location: "dist/, build/", gitignore: "Yes" }
      - { type: Compiled assets, location: "out/, bin/", gitignore: "Yes" }
    rules:
      - "Always separate generated code from hand-written code"
      - "Use src/generated/ as the standard parent directory"
      - "Gitignore if reproducible: code that can be regenerated from a source file (.proto, .graphql, schema) is gitignored"
      - "Commit if critical: when the generation tool is not in CI or generation is non-deterministic, commit the output"
      - "Never edit generated files; add a header comment 'DO NOT EDIT - generated by [tool]'"

physical_spec:
  type: filesystem_schema
  schema:
    root:
      required: ["src", "tests", "docs"]
      ignored: ["dist", "build", "node_modules", "out", "bin", "__pycache__", ".venv", "venv", "target", "vendor", ".gradle", "pkg", ".dart_tool"]
  validator:
    command: "find . -maxdepth 1 -not -path '*/.*'"
    rule: "check_required_directories"