# AI Instruction File Standards - AI Optimized
# Source: core/ai-instruction-standards.md

id: ai-instruction-standards
meta:
  version: "2.1.0"
  updated: "2026-08-12"
  source: core/ai-instruction-standards.md
  description: Best practices for creating AI instruction files (root and skill level) with universal/project-specific separation, i18n strategy, and a detailed cross-tool support matrix

# ─────────────────────────────────────────────
# 工具支援清單 (2026-04-28 更新)
# ─────────────────────────────────────────────
supported_tools:

  # CLI / Agent 型（終端機代理）
  - tool: Claude Code
    vendor: Anthropic
    category: cli_agent
    primary_file: CLAUDE.md
    additional_files:
      - path: .claude/rules/*.md
        note: glob-based conditional rules
    workflow_mechanism: Skills (.claude/skills/*.md → /{skill-name})
    subagent_config: .claude/agents/
    mcp_support: true
    hooks: true
    notes: Hierarchical CLAUDE.md (global → project → subdir); most advanced hook system

  - tool: Gemini CLI
    vendor: Google
    category: cli_agent
    primary_file: GEMINI.md
    workflow_mechanism: ".gemini/commands/*.toml → /{command-name}; supports !{shell} inline"
    subagent_config: .gemini/agents/
    mcp_support: true
    hooks: false
    notes: "1M context window; A2A remote agents; free tier with Google account; Apache 2.0 open source"

  - tool: OpenAI Codex CLI
    vendor: OpenAI
    category: cli_agent
    primary_file: AGENTS.md
    additional_files:
      - path: AGENTS.override.md
        note: temporary override, highest priority
      - path: ~/.codex/AGENTS.md
        note: global fallback
    workflow_mechanism: "Local team commands; /review (non-destructive code review)"
    subagent_config: .codex/agents/
    mcp_support: true
    hooks: true
    notes: "Direct Agents SDK integration; spawn_agents_on_csv batch processing; AGENTS.md traverses from Git root to cwd"

  - tool: OpenCode
    vendor: Open Source
    category: cli_agent
    primary_file: AGENTS.md
    additional_files:
      - path: CLAUDE.md
        note: auto-recognized for migration compatibility
    workflow_mechanism: "No custom slash commands; /init /undo /redo /share built-in"
    subagent_config: .opencode/agents/
    mcp_support: true
    hooks: true
    notes: "75+ LLM providers; CLAUDE.md backward-compatible; HTTP API for programmatic control; 95K+ GitHub stars"

  # AI-native IDE / 編輯器整合
  - tool: Cursor
    vendor: Anysphere
    category: ide
    primary_file: .cursor/rules/*.mdc
    deprecated_file: .cursorrules
    additional_files:
      - path: AGENTS.md
        note: also supported for agent context
    workflow_mechanism: "@-mentions for context; /multitask for parallel subagents; no custom slash commands"
    subagent_config: Background Agents (cloud VM); /multitask inline
    mcp_support: true
    hooks: true
    notes: ".cursorrules is DEPRECATED — migrate to .cursor/rules/*.mdc with MDC frontmatter (description, globs, alwaysApply); Background Agents run on cloud Ubuntu VM; BugBot auto-reviews PRs"

  - tool: GitHub Copilot
    vendor: GitHub / Microsoft
    category: ide
    primary_file: .github/copilot-instructions.md
    additional_files:
      - path: .github/instructions/*.instructions.md
        note: conditional, file-glob scoped (applyTo frontmatter)
      - path: .github/prompts/*.prompt.md
        note: reusable task templates, exposed as slash commands
      - path: .github/agents/*.agent.md
        note: custom agents with fine-grained tool access
      - path: AGENTS.md
        note: also recognized
    workflow_mechanism: ".github/prompts/*.prompt.md → /{prompt-name}; .github/agents/*.agent.md → named agents"
    subagent_config: ".github/agents/*.agent.md; Local/CLI/Cloud/Third-party 4 deployment models"
    mcp_support: true
    hooks: true
    notes: "Organization-level instructions for enterprise; priority: personal > repo > org; multi-model (Claude, GPT-5, Gemini)"

  - tool: Windsurf
    vendor: Codeium
    category: ide
    primary_file: .windsurfrules
    additional_files:
      - path: .windsurf/rules/*.md
        note: MDC frontmatter, structured rules
      - path: AGENTS.md
        note: auto-recognized; subdir scope via location-based activation
    workflow_mechanism: ".windsurf/workflows/*.md → /{workflow-name}; nestable workflows"
    subagent_config: "Up to 5 parallel agents (Wave 13); each in isolated Git worktree"
    mcp_support: true
    hooks: true
    notes: "Arena Mode: compare multiple agents on same task; SWE-1.5 proprietary coding model; MDM enterprise policy deployment; VS Code extension compatible"

  - tool: Cline
    vendor: Open Source
    category: ide
    primary_file: .clinerules
    workflow_mechanism: Chat-based, no custom slash commands
    subagent_config: null
    mcp_support: true
    hooks: false
    notes: VS Code extension; MCP-first design

# ─────────────────────────────────────────────
# 跨工具通用標準：AGENTS.md
# ─────────────────────────────────────────────
cross_tool_standard:
  file: AGENTS.md
  description: |
    AGENTS.md is emerging as the de-facto cross-tool instruction standard.
    Supported by: Gemini CLI, OpenAI Codex CLI, OpenCode, GitHub Copilot, Windsurf, Cursor.
    Recommendation: use AGENTS.md as the universal baseline, then add tool-specific files for advanced features.
  supported_by:
    - Gemini CLI
    - OpenAI Codex CLI
    - OpenCode
    - GitHub Copilot
    - Windsurf
    - Cursor
  not_supported_by:
    - Claude Code  # uses CLAUDE.md; AGENTS.md not auto-recognized
    - Cline        # uses .clinerules

# ─────────────────────────────────────────────
# Slash Commands / Workflow 機制對照
# ─────────────────────────────────────────────
workflow_mechanisms:
  - tool: Claude Code
    mechanism: Skills
    file_pattern: .claude/skills/{name}/SKILL.md
    trigger: "/{skill-name}"
    shareable: true
    notes: Supports allowed-tools, scope, argument-hint frontmatter

  - tool: Gemini CLI
    mechanism: Custom Commands
    file_pattern: ".gemini/commands/{name}.toml (or {namespace}/{name}.toml)"
    trigger: "/{command-name} or /{namespace}:{name}"
    shareable: true
    notes: "Supports !{shell} inline execution; MCP prompts auto-exposed as slash commands"

  - tool: Windsurf
    mechanism: Workflows
    file_pattern: .windsurf/workflows/{name}.md
    trigger: "/{workflow-name}"
    shareable: true
    notes: Nestable; manual trigger only (not auto-invoked by Cascade)

  - tool: GitHub Copilot
    mechanism: Prompt Files + Agent Skills
    file_pattern: ".github/prompts/{name}.prompt.md"
    trigger: "/{prompt-name}"
    shareable: true
    notes: ".github/agents/*.agent.md for specialized agents with tool access control"

  - tool: Cursor
    mechanism: None (native)
    file_pattern: null
    trigger: "@-mentions, /multitask"
    shareable: false
    notes: No custom slash command system; use rules files for persistent behavior

  - tool: OpenAI Codex CLI
    mechanism: Team Commands
    file_pattern: local team config
    trigger: custom
    shareable: false
    notes: Limited; primary interaction via chat

  - tool: OpenCode
    mechanism: None (native)
    file_pattern: null
    trigger: Built-in only (/init /undo /redo /share)
    shareable: false
    notes: No custom slash command system

  - tool: Cline
    mechanism: None
    file_pattern: null
    trigger: null
    shareable: false

content_types:
  universal:
    description: Rules applicable to ANY project
    characteristics:
      - No project-specific paths
      - No hardcoded commands
      - No version numbers
      - No project names or URLs
    examples:
      - Commit message format
      - Code review checklist
      - Testing standards
      - Anti-hallucination rules
      - Documentation style guidelines

  project_specific:
    description: Configuration unique to THIS project
    characteristics:
      - Clearly marked with labels
      - Contains concrete implementation details
    examples:
      - Tech stack (languages, frameworks, versions)
      - Build/test/deploy commands
      - Directory structure
      - Release workflow
      - Team conventions

labeling_conventions:
  option_a:
    name: Section Headers
    example: |
      ## Universal Standards
      [universal content]

      ## Project-Specific Configuration
      [project-specific content]

  option_b:
    name: Inline Markers
    example: |
      > Warning: **Project-Specific**: This section contains configuration unique to this project.

  option_c:
    name: Comment Annotations
    example: |
      <!-- UNIVERSAL: The following applies to all projects -->
      <!-- PROJECT-SPECIFIC: Customize for your project -->

rules:
  - id: separate-universal-specific
    trigger: creating AI instruction file
    instruction: Clearly separate universal rules from project-specific configuration
    priority: required

  - id: no-hardcoded-commands-in-universal
    trigger: writing universal section
    instruction: Never include specific commands (npm, yarn, pip) in universal sections
    priority: required
    examples:
      good:
        - "Run tests before committing"
        - "Execute linting checks"
      bad:
        - "Run `npm test` before committing"
        - "Execute `pip install -r requirements.txt`"

  - id: no-paths-in-universal
    trigger: writing universal section
    instruction: Never include hardcoded paths in universal sections
    priority: required
    examples:
      good:
        - "Store configuration in the config directory"
      bad:
        - "Store configuration in `/var/www/config`"
        - "Store configuration in `cli/src/config`"

  - id: label-project-specific
    trigger: writing project-specific content
    instruction: Always clearly label project-specific sections
    priority: required

  - id: leakage-detection
    trigger: before committing AI instruction file
    instruction: |
      Run leakage detection to find project-specific content in universal sections:
      grep -n "npm\|yarn\|pip\|cargo" CLAUDE.md | head -20
    priority: required

  - id: i18n-canonical-english-only
    trigger: editing canonical AI instruction file
    instruction: Keep description and metadata in English; localize via locales/{lang}/ variants
    priority: required

  - id: i18n-locale-must-match-language
    trigger: creating or editing locale variant
    instruction: Description must be in the locale's language; include source/source_version/translation_version frontmatter
    priority: required

  - id: i18n-l3-template-language-controls-output
    trigger: writing output templates / examples
    instruction: L3 templates determine AI output language; localize L3 in locale variants, never in canonical
    priority: required

  - id: i18n-no-manual-canonical-edits-by-adopters
    trigger: adopter wants to customize an installed instruction file
    instruction: Use uds install --locale or overlays; do not modify canonical files in-place
    priority: required

maintenance_checklist:
  - item: Universal sections contain no project-specific paths, commands, or versions
    required: true
  - item: Project-specific sections are clearly marked with labels
    required: true
  - item: Cross-references to standards documents are correct
    required: true
  - item: Format matches existing sections
    required: true

i18n:
  scope:
    description: |
      Defines language-handling policy for AI instruction files at two levels:
      root-level (CLAUDE.md, .cursorrules, etc.) and skill-level
      (Claude Code SKILL.md, OpenCode plugin instructions, etc.)
    levels:
      - level: root
        files:
          - CLAUDE.md
          - .cursorrules
          - .windsurfrules
          - .clinerules
          - .github/copilot-instructions.md
          - .opencode/instructions.md
        i18n_pattern: single_file_with_inline_language_sections
      - level: skill
        files:
          - .claude/skills/{name}/SKILL.md
          - .opencode/plugins/{name}/instructions.md
        i18n_pattern: canonical_plus_locale_variants

  layered_strategy:
    description: |
      Every AI instruction file has 4 layers. L3 (output templates) is the only
      layer that directly affects AI output language; L1/L2 are processing
      instructions for the AI. Enforce L3 strictly, L1 as a clear convention.
    layers:
      - id: L1
        name: metadata
        content:
          - YAML frontmatter description
          - argument-hint
          - allowed-tools
        canonical_language: english
        locale_language: must_match_locale
        rationale: AI-trigger signal; English has highest training-data density and token efficiency
        impact_on_ai_output: none
      - id: L2
        name: instructions
        content:
          - imperative rules for AI
          - steps
          - behavior rules
        canonical_language: english
        locale_language: locale_optional
        rationale: AI reads English instructions most precisely
        impact_on_ai_output: none
      - id: L3
        name: output_templates
        content:
          - example outputs
          - response format templates
          - scenario examples
        canonical_language: english
        locale_language: must_match_locale_mandatory
        rationale: AI mirrors the language of templates it sees — this is the only layer that controls output language
        impact_on_ai_output: direct
      - id: L4
        name: human_docs
        content:
          - maintainer comments
          - contributor walkthroughs
        canonical_language: english
        locale_language: locale_recommended
        rationale: Read by human maintainers, not by AI
        impact_on_ai_output: none

  file_structure:
    canonical:
      - core/{name}.md
      - core/{name}.ai.yaml
      - skills/{name}/SKILL.md
    locale:
      - locales/{lang}/core/{name}.md
      - locales/{lang}/ai/standards/{name}.ai.yaml
      - locales/{lang}/skills/{name}/SKILL.md
    locale_naming: BCP_47   # zh-TW, zh-CN, ja, ko, en-US, etc.

  locale_variant_frontmatter:
    required_fields:
      - field: name
        value: same as canonical
      - field: source
        value: relative path to canonical file
      - field: source_version
        value: version of canonical at time of translation
      - field: translation_version
        value: version of this translation
    drift_alert:
      condition: source_version gap > 2 minor versions behind canonical
      severity: warn

  responsibility_boundaries:
    - role: canonical_owner
      owns:
        - core/{name}.md
        - core/{name}.ai.yaml
        - skills/{name}/SKILL.md
      duties:
        - Keep L1/L2/L3/L4 in English
        - Bump source_version on every breaking change
    - role: locale_maintainer
      owns:
        - locales/{lang}/...
      duties:
        - Keep translation_version aligned with source_version
        - Translate L1 (required), L2 (optional), L3 (required), L4 (recommended)
    - role: adopter
      owns:
        - their own .claude/skills/, CLAUDE.md
      duties:
        - Install via uds install --locale {lang}
        - Never manually modify canonical files
        - Use overlays or locale variants for customization

  chimera_prevention:
    rules:
      - id: canonical-description-must-be-ascii
        trigger: canonical file with CJK in description field
        severity: error
        instruction: Canonical files must keep description in English; move localized description to locale variant
      - id: locale-description-must-match-language
        trigger: locale variant with ASCII-only description
        severity: error
        instruction: Locale variant description must use the locale's language
      - id: locale-must-have-source-frontmatter
        trigger: locale variant missing source/source_version/translation_version
        severity: error
        instruction: Add traceability frontmatter pointing to canonical
      - id: canonical-l3-language-consistency
        trigger: canonical L3 output template contains non-English example
        severity: warn
        instruction: Localize L3 templates in locale variants, not canonical
      - id: adopter-must-match-installed-locale
        trigger: adopter file in .claude/skills/ differs from both canonical and any locale variant
        severity: warn
        instruction: Use uds install --locale or overlays instead of manual canonical edits
      - id: translation-drift-warn
        trigger: translation_version lag > 2 minor versions behind source_version
        severity: warn
        instruction: Re-sync translation from current canonical version

  installation_model:
    cli: uds install --locale {lang}
    locale_resolution_priority:
      - --locale CLI flag
      - .uds/install.yaml locale field
      - environment variable UDS_LOCALE
      - fallback to en
    missing_locale_behavior:
      action: fallback_to_canonical_with_warn
      block_install: false
      coverage_visibility: locales/COVERAGE.md

  migration:
    name: adopter_chimera_cleanup
    steps:
      - id: identify
        description: Compare adopter files against UDS canonical and locale variants
      - id: install_proper_variants
        description: Run uds install --locale {lang} to replace chimera
      - id: preserve_legitimate_customization
        description: Extract project-specific (non-translation) customization into overlay or UDS-CUSTOMIZATION.md
      - id: discard_pure_translations
        description: Chimera changes that were only translations are superseded by locale variants

quick_reference:
  content_types:
    columns: [Type, Contains, Example]
    rows:
      - [Universal, Generic rules, "Run tests before committing"]
      - [Project-Specific, Concrete commands, "Run `npm test` before committing"]

  section_markers:
    columns: [Marker, Meaning]
    rows:
      - ["## Universal", Applicable to any project]
      - ["## Project-Specific", Unique to this project]
      - ["> Warning: Project-Specific", Inline warning for specific section]
