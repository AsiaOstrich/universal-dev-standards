name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which paths changed to conditionally run expensive jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      # XSPEC-383 R4 — command-existence's source surface is NOT cli/** alone.
      # It walks core/, locales/, ai/standards/, cli/src/, skills/, docs/, and
      # repo-root *.md — every place a `uds <cmd>` instruction can live. Reusing
      # the narrower `cli` filter would make the gate go silent on exactly the
      # kind of change that caused the incident this gate exists for (a stale
      # doc, untouched cli/): docs/user/CHEATSHEET.md and skills/workflows/README.md
      # both shipped a removed command (`uds workflow`) for months without any
      # CI job re-checking them, because nothing gated on those paths.
      command-existence: ${{ steps.filter.outputs.command-existence }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
            command-existence:
              - 'core/**'
              - 'locales/**'
              - 'ai/standards/**'
              - 'cli/**'
              - 'skills/**'
              - 'docs/**'
              - '*.md'

  # XSPEC-355 R3a — the check-*.sh ratchet.
  #
  # tests/scripts/check-scripts-passing.bats asserts every listed check exits 0,
  # and its header already said "if any of these start failing, it indicates a
  # real regression". It was never run by anything: `npm run test:scripts`
  # appeared only in package.json and scripts/README.md. Wiring it here is what
  # makes the ratchet real.
  #
  # WIDENED 2026-07-29 (XSPEC-073 G1): 1 of 16 files → all 16, via the documented
  # command.
  #
  # Wiring one file left the other fifteen in exactly the condition the comment
  # above diagnoses, and the same commit that added this job broke one of them:
  # efe8df23 bumped TOTAL 23 → 24 in pre-release-check.sh, updated
  # check-scripts-passing.bats, and missed pre-release-check.bats — the sibling
  # nothing would have reported. It stayed red six days.
  #
  # Measured before widening: all 16 files pass (148 ok / 0 not ok), ~150s, no
  # network dependency, no absolute paths, no external tools. So this does not
  # turn CI red on contact.
  #
  # The earlier note said the known-failures file must not be gated because it
  # "documents current, re-measured failures". Its assertions were re-read on
  # 2026-07-29 and they are crash-only — `[ -x ... ]` and `[ ${#output} -gt 0 ]`.
  # Nothing asserts that a check FAILS, so fixing the underlying check cannot
  # break it, and including it is safe. Its maintenance rule (promote an entry
  # the day it goes green) is unaffected by being run here.
  #
  # Uses `npm run test:scripts` rather than naming files, so the gate and the
  # documented local command stay the same thing — the divergence between those
  # two is what this whole job exists to close.
  script-ratchet:
    name: Check Script Ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # tests/bats is a git submodule (bats-core); checkout skips submodules
          # by default, which made the first run of this job exit 127.
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all script tests
        run: npm run test:scripts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # XSPEC-383 R3 — 可達性閘門。
  #
  # 2026-04-07 建了 spec-linter.js 與 sync.js，兩者有測試、測試都過，
  # 而**沒有任何使用者到得了它們**；同一天 VibeOps 接上了 `npx uds lint --json`，
  # 一個永遠不存在的指令。四個半月兩邊全綠。單元測試證明函式對，
  # 對「有沒有人叫得到」一個字都沒說——這個 job 就是在問那個問題。
  #
  # 接上時**不會當場燒紅**（沿用上方 script-ratchet 那條「measured before
  # widening」的規矩）：落地當下實測 121 個模組、96 可達、24 不可達，
  # 那 24 個寫進 cli/scripts/reachability-baseline.json，閘門只對**新增的**孤兒失敗。
  # 基線帶 2026-11-19 到期日——**沒有時鐘的例外清單只是有禮貌的刪除鍵**，
  # 過期後這支一律回 1，逼人重做一次「先不處理」的判斷。
  #
  # 三臂已實測：綠（現況 rc=0）／新增孤兒紅（放一個沒人 import 的模組 rc=1）／
  # 基線過期紅（rc=1）。一支從未紅過的檢查與一支永遠回綠的檢查無從分辨。
  reachability:
    name: Module Reachability
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      # 🔴 2026-08-20 補：這一步原本不在，而它的缺席讓本 job 在 main 上連紅四次
      # 沒有人看（5b0f99c3、aeafab51＝6.8.0 發版那次、30174e1d，以及更早一次）。
      # 探針 spawn 的是 cli/bin/uds.js；沒有 node_modules 它會因 ERR_MODULE_NOT_FOUND
      # 立刻死掉，而 check-command-existence.mjs 的存在性判定是「輸出裡沒有
      # unknown command 就算存在」——崩潰的 CLI 永遠不會印那句話，於是**每個指令
      # 都判成存在**，掃描回報 0 個問題。腳本端已加 verifyProbeIsWorking() 讓這種
      # 狀態結束於 2（量不了）而非 0，這一步則是讓它根本不要發生。
      - name: Install dependencies
        run: npm ci

      - name: Prove the check can fail before trusting that it passed
        run: node scripts/check-module-reachability.mjs --self-test

      - name: Check module reachability
        run: npm run check:reachability

  # XSPEC-383 R4 — 指令存在性閘門。
  #
  # 2026-08-19 實測：UDS 出貨的指引裡有指令是根本不存在的（`uds install`、
  # `uds lint`、`uds sync`，外加 `uds check --spec-size`、`uds spec create --boost`），
  # 落點含兩處會把壞指令送到使用者面前的活程式碼（quickstart.js、
  # integration-generator.js，已於 465335e4 修掉）。同一輪也在
  # docs/user/CHEATSHEET.md、skills/workflows/README.md 等處挖出 v6.0.0 已移除的
  # `uds workflow` 被當現行指令展示了數個月——「我們叫別人跑的指令是否真的存在」
  # 這個面，在此之前零個檢查。
  #
  # 來源範圍見 check-command-existence.mjs 的 SOURCES：不只 cli/**，還含
  # core/、locales/、ai/standards/、skills/、docs/、repo-root *.md——因此本 job
  # 掛在 `changes` job 新增的 command-existence filter 下，不是既有的 cli filter
  # （見上方 changes job 的註解）。
  #
  # 三臂已實測：對照組（探針對已知不存在/存在的指令名正確回報）／分母臂（走訪
  # 1594 檔跨 7 個來源）／綠臂（現況乾淨）／紅臂（塞一個 `uds definitelynotacommand`
  # 到真實掃描路徑下的檔案，證明完整流程真的會紅，測完自動刪除）。
  command-existence:
    name: Command Existence
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.command-existence == 'true'
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      # 🔴 2026-08-20 補：這一步原本不在，而它的缺席讓本 job 在 main 上連紅四次
      # 沒有人看（5b0f99c3、aeafab51＝6.8.0 發版那次、30174e1d，以及更早一次）。
      # 探針 spawn 的是 cli/bin/uds.js；沒有 node_modules 它會因 ERR_MODULE_NOT_FOUND
      # 立刻死掉，而 check-command-existence.mjs 的存在性判定是「輸出裡沒有
      # unknown command 就算存在」——崩潰的 CLI 永遠不會印那句話，於是**每個指令
      # 都判成存在**，掃描回報 0 個問題。腳本端已加 verifyProbeIsWorking() 讓這種
      # 狀態結束於 2（量不了）而非 0，這一步則是讓它根本不要發生。
      - name: Install dependencies
        run: npm ci

      - name: Prove the check can fail before trusting that it passed
        run: node scripts/check-command-existence.mjs --self-test

      - name: Check command existence
        run: npm run check:command-existence

  # XSPEC-357 R7 ② — 採用者指令檔閘門。
  #
  # `scripts/check-ai-agent-sync.sh` 檢查的是本 repo 的 integrations/ 樣板，
  # 採用者拿到的則是 `uds init` 寫出來的另一份檔案、由另一段程式產生。
  # 2026-08-20 用同一組規則樣式實測：樣板 6–7/7，採用者檔案 0–2/7。
  # 規格原文：「a rule can be present for the checker and absent for every
  # user, with nothing going red.」這個 job 就是那個 red。
  #
  # 它**不**斷言規則本文出現在採用者檔案裡，也永遠不會——`.standards/` 143 份
  # .ai.yaml 約 248k tokens，塞不進去。它斷言的是那份檔案有沒有**說出**自己
  # 只是索引、並指示去打開 `.standards/` 底下的檔案。未斷言的部分（規則本文
  # 覆蓋率、npm tarball、agent 實際行為）每次執行都印出數字，不讓它變成沉默的洞。
  #
  # 三態結束碼：0 乾淨／1 有發現／2 量不了（量不了不是綠燈）。
  #
  # ── 為什麼沒有路徑過濾 ──────────────────────────────────────────────
  # 被檢查的產物由一條橫跨 cli/src/（generator、installer、detector、
  # constants）、cli/standards-registry.json、以及 core//ai//locales/ 標準樹的
  # 管線產生。要寫過濾器就得把這條管線列舉出來——而**列舉**正是
  # `codex -> integrations/codex/AGENTS.md` 這個錯誤的成因。上方 changes job
  # 的註解記著同一個教訓：窄過濾器會在正好該說話的那次改動上靜音。
  # 安裝完之後這支檢查本體約 1.2 秒（實測），沒有省它的理由。
  #
  # ── 為什麼不掛進 script-ratchet ────────────────────────────────────
  # 那個 job 只在 repo 根目錄跑 `npm ci`，而 `uds init` 需要 cli/node_modules。
  # 掛進去會讓它以 exit 2（量不了）收場——正確的訊號，但每次都亮，等於沒有訊號。
  # 所以獨立成 job，兩處都裝。
  #
  # 三臂已實測（2026-08-20）：綠（5 情境 33 檔 0 發現，rc=0）／
  # 紅（關掉 generator 的揭露句輸出 → 5 情境中 4 個共 35 個發現，逐一指名檔案與
  # 斷言；未被動到的通用 AGENTS.md 情境維持 0，rc=1）／
  # 量不了（移走 cli/bin/uds.js → rc=2）。另有 --self-test：在真實產物上做四種
  # 破壞，5/5 臂都如預期觸發。一支從未紅過的檢查與一支永遠回綠的檢查無從分辨。
  adopter-instruction-files:
    name: Adopter Instruction Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies (tsx)
        run: npm ci

      # `uds init` runs out of cli/, so its runtime deps have to be present or
      # the check exits 2 rather than saying anything about adopters.
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Prove the check can fail before trusting that it passed
        run: npm run check:adopter-files:self-test

      - name: Check adopter instruction files
        run: npm run check:adopter-files -- --verbose

  # ── Skill 觸發面（XSPEC-378 R4）────────────────────────────────────
  # 每份 SKILL.md 的 description 必須同時有 `Use when:`（觸發條件）與
  # `Not for:`（排除條件）。只有觸發沒有排除會換來過度觸發，而過度觸發的
  # skill 會被使用者關掉——那比不觸發更糟，它會連帶拖走還能用的那些。
  #
  # 接上時**不會當場燒紅**：落地當日實測三個 root 全數 165/165 通過。
  # 這正是接閘門的時機——在乾淨的時候接，而不是等它再壞一次。
  # R1/R2 修好了語料，在此之前沒有任何東西阻止它重新壞掉。
  #
  # 分母是走訪出來的不是列舉的：root 由磁碟探索（skills/ 加上每個
  # locales/<locale>/skills/），新增語系會自動納入。涵蓋 locales 是必要的——
  # 翻譯副本才是 zh-TW 採用者的 agent 實際讀到的那一份，只看英文來源的閘門
  # 會窄於它要執行的規則。
  #
  # 三臂已實測（2026-08-20）：綠（181 個目錄走訪 → 165 skill、16 個因無
  # SKILL.md 被排除且逐一具名，0 發現，rc=0）／紅（在語料副本上刪掉
  # skills/push 的 `Not for:` → 1 個發現，指名 push/SKILL.md 與 not-for，
  # rc=1）／量不了（--root 指向不存在的目錄 rc=2；未知旗標 rc=2）。
  # 另有 --self-test：7/7 臂如預期觸發。
  # 探針校準：同一套抽取跑在 b12e3633^ 得到 Use when: 27/55、Not for: 0/55，
  # 與 XSPEC-378 記載的病灶數字逐位元相同——能重現原始病灶的探針不是太寬的探針。
  skill-trigger-surface:
    name: Skill Trigger Surface
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies (tsx)
        run: npm ci

      - name: Prove the check can fail before trusting that it passed
        run: npm run check:trigger-surface:self-test

      - name: Check skill trigger surface
        run: npm run check:trigger-surface

  # ── llms.txt 漂移閘門（XSPEC-385）────────────────────────────────────
  # PR #179 提議加一份**手寫的** llms.txt,2026-08-20 婉拒。理由就是
  # XSPEC-385 立的那條規則:手寫的 llms.txt 是專案自我描述的第二份複本,
  # 既沒有檢查也沒有到期日——合併當天是對的,之後安靜地變錯,而中間不會有
  # 任何東西亮紅燈。
  #
  # 所以內容改為從「本來就必須正確」的來源生成(uds-manifest.json、core/、
  # skills/、integrations/REGISTRY.json、cli/package.json),而這道檢查就是
  # 它的時鐘:重新算一次,與已提交的檔案有一個位元組不同就失敗。
  #
  # ⚠️ 版本號寫在檔案裡,而 bump-version.mjs 不會重新生成任何東西,
  # 所以**版本 bump 之後第一次 check 一定會紅**——那是時鐘在工作,不是壞掉。
  # 修法是一道指令 `npm run docs:llms-txt`,失敗訊息本身會這樣說。
  #
  # 三臂已實測(2026-08-20,皆為 process 層級而非 in-process):
  # 綠(生成後立即 check,rc=0)／紅(把 `## Skills (55)` 手改成 (999) →
  # 指名第 176 行並列出兩種寫法,rc=1;刪掉 llms.txt → 明講檔案不存在而非略過,
  # rc=1)／量不了(搬走 uds-manifest.json rc=2;未知旗標 rc=2)。
  # 另有 --self-test:6/6 臂如預期觸發,其中一臂專門確認 PR #179 那個
  # 「Repository 與 Homepage 兩個條目指向同一個 URL」的缺陷會被去重掉。
  llms-txt:
    name: llms.txt Drift Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prove the gate can fail before trusting that it passed
        run: npm run check:llms-txt:self-test

      - name: Check llms.txt against its sources
        run: npm run check:llms-txt

  # ── 自採用 skill 副本漂移閘門（XSPEC-385）──────────────────────────────
  # `.claude/skills/` 是 UDS 自己吃自己的狗糧：在這個 repo 裡工作的 agent
  # 實際載入的那一批 skill。它裝過一次就沒人再管，2026-08-20 實測：
  # source 55 份全數帶 `Use when:` 與 `Not for:`，副本 48 份**一份都沒有**，
  # 少 11 個 skill，另有 4 個目錄還停在 commit a1664ee0（2026-04-29，
  # XSPEC-100）改名前的舊名字。**出貨路徑不受影響，壞的是自己用的那一份。**
  #
  # 手修一次會在合併當天是對的、之後安靜地變錯，中間不會有任何東西亮紅燈——
  # 那正是 XSPEC-385 立的那條規則。所以內容改為從「本來就必須正確」的來源
  # 生成（skills/、locales/<locale>/skills/、integrations/REGISTRY.json、
  # cli/src/config/ai-agent-paths.js），而這道檢查就是它的時鐘。
  #
  # ⚠️ `.manifest.json` 寫著 CLI 版本，而 bump-version.mjs 不會重新生成任何
  # 東西，所以**版本 bump 之後第一次 check 一定會紅**——那是時鐘在工作。
  # 修法是一道指令 `npm run docs:adoption-skills`，失敗訊息本身會這樣說。
  #
  # `.gemini/skills/` **刻意不生成**：Gemini CLI 已於 2026-06-18 停止服務，
  # `.gemini/DEPRECATED.md` 明文寫「Not updated when skills/ changes … do not
  # 'fix' it」。排除是讀 integrations/REGISTRY.json 的 `deprecated` 旗標得到的，
  # 不是在腳本裡寫死 `.gemini` 這個名字。
  #
  # 已實測（2026-08-20，皆為 process 層級）：
  #   前置紅 — 接閘門前先對「已提交的舊副本」跑 --check：80 項漂移
  #            （54 DIFFERS／22 MISSING／4 STALE），rc=1。
  #            **這道閘門的第一次真跑就是在真實內容上紅的**，這是唯一算數的校準。
  #   綠     — 生成後立即 --check，rc=0
  #   紅     — 手改 commit-standards/SKILL.md 一行 → **只報 1 項**，
  #            指名該檔第 11 行並列出兩種寫法，rc=1（會定位，不只是會察覺）
  #   紅     — 刪掉 .claude/skills/push/ → 報 MISSING 並具名，rc=1
  #   紅     — 把改名前的 process-automation/ 放回去 → 報 STALE 並引用
  #            那份 `source:` 指標當證據，rc=1
  #   量不了 — 樹裡有 locales/ 但沒有 skills/，rc=2
  #   量不了 — 樹裡有 skills/ 但沒有對應語系包，而 target 宣告 zh-TW：
  #            拒絕執行而非把 55 份翻譯覆寫成英文，rc=2
  #   量不了 — 移除 .manifest.json，rc=2；未知旗標 rc=2
  #   --self-test — 9/9 臂如預期觸發，其中一臂專門確認「沒有 source: 戳記的
  #            手寫 SKILL.md 不會被刪掉」——會刪東西的產生器，危險的不是漏刪。
  adoption-skills:
    name: Self-Adoption Skill Drift Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prove the gate can fail before trusting that it passed
        run: npm run check:adoption-skills:self-test

      - name: Check the self-adoption skill copies against their sources
        run: npm run check:adoption-skills

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI runs
        run: node bin/uds.js --version

      - name: Verify list command
        run: node bin/uds.js list

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: E2E Tests
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e

  # XSPEC-073 G2 — the coverage gate was never wired.
  #
  # cli/vitest.config.js has carried coverage thresholds since it was written,
  # but nothing in CI ever ran coverage: `grep -rn coverage .github/workflows/`
  # returned nothing on 2026-07-29. The thresholds only applied if a human
  # happened to run `npm run test:coverage` locally, and they were set at
  # 25/15/25/25 against an actual 63/55/73/64 — so even then they could not fire.
  #
  # Runs the full suite (test:coverage = `vitest run --coverage`, include
  # tests/**/*.test.js), not the unit subset, because that is the set the
  # thresholds were measured against.
  #
  # Single job, not a matrix: coverage is a property of the code, not of the
  # runner OS, and the matrix exists to catch platform-specific behaviour.
  coverage:
    name: Coverage Gate
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coverage gate
        run: npm run test:coverage

  translation-sync:
    name: Translation Sync Check
    runs-on: ubuntu-latest
    # Known: 144 missing-source files from past directory restructuring (tech debt)
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check translation sync
        run: |
          chmod +x ./scripts/check-translation-sync.sh
          ./scripts/check-translation-sync.sh

  cli-docs-sync:
    name: CLI-Docs Sync Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check CLI-docs sync
        run: |
          chmod +x ./scripts/check-cli-docs-sync.sh
          ./scripts/check-cli-docs-sync.sh

  # bump ↔ check 往返不變量。
  #
  # bump-version.mjs 寫版本號、check-version-sync.sh 檢查版本號，而**兩者各自持有
  # 一份手工維護的「哪些檔案帶版本號」清單**。2026-08-20 發 6.8.0 時它們漂開了：
  # bump 動了 package.json、registry、manifest 與三份 README，卻不含三份 SECURITY.md
  # ——而 check 有檢查那三份。
  #
  # **這個不變量原本就有東西在守**：bump-version.mjs:301 跑完會呼叫
  # check-version-sync.sh，失敗就 exit 1。所以本 job 不是「補上一個不存在的檢查」，
  # 而是把它**提前**——原本只在有人真的發版時才會炸，也就是在最貴的那一刻炸；
  # 6.8.0 那天正是如此，發版流程中途停下來手改三個檔案。這裡讓它在每次 CI 就說話。
  #
  # 不設路徑過濾：漂移的形狀是「**某個新檔案開始帶版本號，而只有其中一支腳本知道它**」，
  # 那個新檔案可以出現在 repo 任何地方。窄過濾器會在正好該說話的那次改動上靜音
  # ——與 command-existence 那條註解記的是同一個病。實測整支 23 秒，無條件跑得起。
  #
  # 三臂已實測（2026-08-20）：綠（現況 rc=0，14 個檔案改完全數還原、樹乾淨）／
  # 紅（把 bump 的 SECURITY.md 段拿掉 → rc=1，且指名那三個檔案）／
  # 拒跑（工作區髒 → rc=2，**不是綠燈**）。一支從未紅過的檢查與一支永遠回綠的
  # 檢查無從分辨，所以紅臂是在拋棄式 clone 外加真 repo 的暫存分支上各跑過一次。
  #
  # ⚠ 本檢查會真的跑一次 bump 並就地改檔，再用 git checkout 還原。它拒絕在髒工作區
  # 執行（rc=2），CI 的 checkout 一定是乾淨的所以無妨；本機跑之前請先 commit。
  bump-sync-roundtrip:
    name: Bump/Sync Roundtrip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 刻意**不**叫「Prove the check can fail」——這一步證明不了那件事，
      # 它只確認前置條件齊備。紅臂用變異驗過，記錄在腳本 docblock。
      - name: Verify preconditions (not a red-arm proof)
        run: npm run check:bump-roundtrip:self-test

      - name: Check bump/sync roundtrip
        run: npm run check:bump-roundtrip
