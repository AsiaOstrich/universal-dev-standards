name: Weekly Standards Health Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd cli && npm ci

      - name: Run health score
        id: health
        run: |
          # 本 job 到 2026-09-16 為止仍每週失敗。前一輪修掉了多行 SCORE，剩下的根因
          # 是**審的是錯的目錄**：這一步原本 `cd cli` 再 audit，而 cli/.gitignore 忽略
          # .standards/——CI 的乾淨 checkout 裡那個目錄不存在，audit 回 error，而 --ci
          # 模式只印一個 `0` 把錯誤訊息吃掉。本機看不到，因為本機 cli/.standards 是
          # 早年留下的殘跡。標準在 repo 根目錄，就在根目錄審。
          node cli/bin/uds.js audit --score --self --format json > health-report.json
          ERR=$(node -e 'const r=require("./health-report.json"); if (r.error) console.log(r.error)')
          if [ -n "$ERR" ]; then
            echo "audit 失敗：$ERR"
            exit 1
          fi
          SCORE=$(node -e 'console.log(require("./health-report.json").score)')
          echo "Score: $SCORE"
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

      - name: Run dependency audit
        run: cd cli && npm audit --json > ../npm-audit.json 2>&1 || true

      - name: Check for degradation
        id: check
        run: |
          SCORE=${{ steps.health.outputs.score }}
          echo "Current score: $SCORE"
          if [ "$SCORE" -lt 75 ]; then
            echo "degraded=true" >> $GITHUB_OUTPUT
            echo "reason=Score below threshold (75)" >> $GITHUB_OUTPUT
          else
            echo "degraded=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if degraded
        if: steps.check.outputs.degraded == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('health-report.json', 'utf-8'));
            } catch (e) {
              report = { score: '${{ steps.health.outputs.score }}', error: 'Could not parse report' };
            }

            const dims = report.dimensions || {};
            const dimLines = Object.entries(dims)
              .map(([name, dim]) => `- **${name}**: ${dim.score}/100`)
              .join('\n');

            const body = `## 自動偵測\n\n**Overall Score**: ${report.score}/100\n\n### 維度分數\n${dimLines}\n\n### 觸發原因\n${{ steps.check.outputs.reason }}\n\n---\n*此 Issue 由 scheduled-health workflow 自動建立*`;

            // 每週開一張新的等於每週製造一張重複 issue，而重複的告警最後會被整批關掉。
            // 已經有開著的就補一則留言。
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'standards-health'
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ 標準健康分數下降: ${report.score}/100`,
                body,
                labels: ['auto-detected', 'standards-health']
              });
            }
