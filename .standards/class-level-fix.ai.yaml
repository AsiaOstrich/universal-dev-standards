# Class-Level Fix Standard - AI Optimized
# Source: core/class-level-fix.md

standard:
  id: class-level-fix
  name: Class-Level Fix Standard
  description: 類別層修正標準——修正瞄準集合，不是瞄準成員

  meta:
    version: "1.1.0"
    updated: "2026-08-14"
    source: core/class-level-fix.md
    description: >
      一個缺陷幾乎從不孤單，它是某個集合的一員。修掉被指出的那一員，
      集合裡其餘的原封不動，而沒有東西會通知你下一個在哪。
      本標準要求修正瞄準集合：指出可窮舉集合，並加上一個「走訪」而非「列舉」該集合的檢查。
      v1.1.0：新增負向控制的極限聲明（CLF-007：通過一次只證明認得那一個案例，
      不證明認得該規則的每一種違反）；新增窄涵蓋登記規則（CLF-008，與
      verification-evidence VE-012 共用：涵蓋缺口須登記到帶到期日的例外清冊，
      單純揭露不滿足本條）。

  iron_law: >
    修一個缺陷之前，先指出它所屬的可窮舉集合，並加上一個走訪該集合的檢查。
    若該集合無法被走訪，寫下為什麼——沉默不算答案。

  guidelines:
    - "修正瞄準集合，不是瞄準成員"
    - "**走訪並排除，絕不列舉**——列舉正確到有人新增第四個成員為止，而沒有東西會告訴你"
    - "走訪必須從系統自己讀的那個來源讀（CLI 定義／目錄／manifest），**不從手打的清單讀**"
    - "檢查要印出分母**與被排除的數量**，不是只印「全部通過」"
    - "類別層檢查在被信任之前，先以合成成員證明它不是空跑——**逐子集做，不要整體做**"
    - "集合無法走訪是合法答案，但要寫下理由與解除條件"
    - "**註解描述了類別，不等於有檢查涵蓋類別**——散文不會執行"

  # 依序回答，第 3 題決定這道檢查活不活得下去
  three_questions:
    - order: 1
      question: "這個缺陷是哪個集合的一員？"
      examples: ["分派鏈裡的旗標", "manifest 的條目", "agents/ 底下的目錄", "目錄樹裡的設定檔"]
    - order: 2
      question: "那個集合能不能被走訪而不是被列舉？"
    - order: 3
      question: "走訪從哪裡讀出成員？"
      note: >
        必須從系統自己讀的那個來源讀。從手打的清單讀，等於把同一個缺陷
        換一個位置重新製造一次。

  walk_vs_enumerate:
    enumerate:
      shape: "for (const x of ['a','b','c'])"
      new_member: "靜默地不被涵蓋"
      failure_mode: "對一部分表面回報綠燈"
    walk_and_exclude:
      shape: "for (const x of readAll()) if (!EXCLUDED.has(x))"
      new_member: "**預設被涵蓋**"
      failure_mode: "吵——而吵是看得見的"
    why: >
      不對稱正是重點。列舉失敗時是靜默的；排除清單失敗時是吵的，
      因為那條排除必須由一個人寫下來，而他得說明理由。

  # 一道類別層檢查在被信任之前必須先被證明非空跑
  evidence_requirement:
    steps:
      - "塞一個違反規則的合成成員"
      - "確認檢查失敗**且指名該成員**"
      - "移除後確認回到綠燈"
    granularity: per_subset
    why_per_subset: >
      一道涵蓋五份清單、卻只對第一份測過的檢查，是一道涵蓋一份清單的檢查。
    limitation: >
      一次通過的負向控制只證明一個已知壞案例能到達檢查器的失敗路徑，
      不證明檢查器認得該規則的每一種違反。一道 grep 閘可以 fail-closed 得很完美，
      卻守著一個拼字而不是一個行為——合成成員證明的是線路接通了，不是那張網夠寬，
      足以抓住它自稱要抓的東西。

  output_requirement:
    must_print: ["實際檢查的數量（分母）", "被排除的數量"]
    rationale: >
      只印分母不夠。「檢查了 4,012 條宣告」讀起來像涵蓋率，
      而篩選器悄悄跳過了每一條目錄條目。

  # 集合無法走訪時的合法出口
  when_not_walkable:
    legitimate: true
    must_record: ["理由", "什麼條件下會改變"]
    common_cause: >
      成員只能相對於某個基準目錄才知道，而那個基準沒有記在任何機器讀得到的地方
      （例如 manifest 的路徑基準只活在讀取它的程式裡）。對這種宣告做通用掃描，
      假陽性率高到讓檢查在第一週就被關掉。
    workable_form: >
      逐份清冊——一種宣告一道檢查，各自知道自己的基準與條目形狀。
      說出清冊有幾份，並確認每一份都有檢查。

  # ── v1.1.0 窄涵蓋登記規則（B-01 借鑒，與 verification-evidence VE-012 共用同一條要求）──
  narrow_coverage_registration:
    description: "當一道閘門的實際涵蓋面窄於它所服務的規則時，只寫一句話揭露是不夠的——揭露必須登記，不能只揭露"
    why: >
      散文式揭露很便宜，比擴大涵蓋面便宜得多。每一道被審過一次的窄閘門都會長出一段
      誠實的文字，然後永遠維持窄下去。揭露本身不換來任何東西；只有配上一個能證明
      它沒有淪為永久藉口的機制，它才換得到東西。
    requirement: >
      任何這一類已記錄的涵蓋缺口，必須同時登記到一份帶到期日的例外清冊——一份獨立於
      標準本文之外的清單，指名缺口、說明成因、並附上覆核或到期日期。沒有登記到這種
      清冊裡的揭露，不滿足本條。
    falsifiable_condition: >
      若某條目連續兩期清冊審查都未變動，該揭露就已經變成逃生口，本條對該條目失效——
      不是「部分滿足」，是失效。清冊機制本身（放在哪裡、什麼格式、多久審一次）留給
      採用它的專案自行決定；本標準要求的是「有這麼一份東西存在，且條目會動」。
    shared_with: verification-evidence
    shared_rule_id: VE-012

  anti_patterns:
    - pattern: "修掉被回報的那一員就結案"
      why: "集合沒有變；下一個成員會以新事故的形式抵達"
    - pattern: "寫一段註解說明通則"
      why: "散文不會執行"
    - pattern: "檢查自行列舉它的範圍"
      why: "正確到有人新增第四個成員為止"
    - pattern: "類別層檢查只對一個成員測過"
      why: "證明的是那一個成員，不是那個類別"
    - pattern: "`✓ all pass` 而沒有分母"
      why: "掃了全部與什麼都沒掃，輸出一模一樣"
    - pattern: "一句揭露文字，沒有登記到帶到期日的例外清冊"
      why: "比擴大涵蓋面便宜，而且沒有任何東西逼它改變"

  rules:
    - id: CLF-001
      rule: "修正前必須指出缺陷所屬的可窮舉集合"
      severity: error
    - id: CLF-002
      rule: "類別層檢查必須走訪集合並排除例外，不得列舉成員"
      severity: error
    - id: CLF-003
      rule: "走訪的成員來源必須是系統自己讀的來源，不得是手寫清單"
      severity: error
    - id: CLF-004
      rule: "檢查輸出必須包含分母與被排除的數量"
      severity: error
    - id: CLF-005
      rule: "類別層檢查須以合成成員逐子集證明非空跑"
      severity: error
    - id: CLF-006
      rule: "集合無法走訪時，須記錄理由與解除條件"
      severity: warning
    - id: CLF-007
      rule: "宣稱一道類別層檢查『涵蓋』某規則前，須指出檢查辨識的是規則的字面/語法特徵，還是它想守護的行為——通過一次負向控制只證明檢查器認得那一個案例"
      severity: warning
    - id: CLF-008
      rule: "當閘門的實際涵蓋面窄於它所服務的規則時，該缺口必須登記到一份帶到期日的例外清冊，單純寫下揭露文字不滿足本條（與 verification-evidence VE-012 共用）"
      severity: warning

  # 本標準自己沒有自動閘門——依它自己的規則，這件事必須寫下來而不是暗示強制力存在
  enforcement:
    automated_gate: false
    why_not: >
      沒有任何檢查能走訪「現在正在被修的所有缺陷」。套用本標準是修的當下所做的判斷。
    enforced_by: review
    review_question: "這是哪個集合的一員？"
    reopen_condition: >
      若 repo 取得「能把一次缺陷修正落地看成離散事件」的機制（有標記的 commit 型別、
      issue↔commit 連結），即可斷言這類 commit 要嘛動到一個走訪集合的測試，
      要嘛帶著寫下來的理由。
    note: >
      一份陳述了規則而沒有東西執行它的標準，正是「寫下來的風險沒有東西在執行」那個形狀。
      不承認這一點的標準比承認的更糟，因為讀的人會以為有東西在盯。

  related:
    - id: verification-evidence
      relation: "同一族：工具靜默失敗時，其輸出與真結果無從分辨。本標準是同一件事套用在**範圍**而非**執行**上；也與本標準共用「窄涵蓋必須登記」規則（VE-012 / CLF-008）"
    - id: anti-hallucination
      relation: "那個防「沒查」；這個防「查了其中一個，卻對全部下結論」"

physical_spec:
  applies_to:
    - "任何缺陷修正（程式碼或設定）"
  deliverables:
    - "一道走訪集合的檢查，或一份「為何無法走訪」的紀錄"
    - "該檢查的逐子集對照組證據"
