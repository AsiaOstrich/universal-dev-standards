# AI Response Navigation Standards (AI-Optimized)
# Source: core/ai-response-navigation.md

id: ai-response-navigation
meta:
  version: "1.3.0"
  updated: "2026-08-17"
  source: core/ai-response-navigation.md
  description: >
    Every substantive AI response must include contextual next-step suggestions with recommended
    options (rules 1-6, required). Optional rules 7-11 govern the answer itself: lead with the
    finding, restate state across turns, no preamble, plain language as the subject, and a
    trade-off on every option rather than only the recommended one.

rules:
  - id: navigation-footer
    trigger: completing any substantive AI response (task completion, analysis, question, error report, code change)
    instruction: >
      Append a Navigation Footer at the end of every logical response unit using Markdown blockquote (>).
      Exempt ultra-short confirmations like "OK", "Done", "Got it" that are not independent logical units.
    priority: required

  - id: recommendation-marking
    trigger: providing 2 or more next-step options
    instruction: >
      Mark the recommended option with ⭐ **Recommended** (or localized equivalent like ⭐ **推薦**).
      Append the reason after " — ". If no option is clearly better, describe each option's use case instead.
      If only one reasonable next step exists, suggest it directly without marking.
    priority: required

  - id: contextual-templates
    trigger: generating a Navigation Footer
    instruction: >
      Select the template based on response type:
      - Task completed → title "Suggested next steps" / "建議下一步", 2-3 options
      - User question → title "Please choose" / "請選擇", 2-5 options with (A)(B)(C) labels
      - Error/failure → title "Suggested resolution" / "建議修復方向", 1-3 options
      - In progress → title "Progress: [N/M]. Next" / "目前進度：[N/M]。下一步", 1-2 options
      - Informational reply → title "Suggested next steps" / "建議下一步", 1-3 options
    priority: required

  - id: adaptive-quantity
    trigger: deciding how many options to include in Navigation Footer
    instruction: >
      Adjust option count based on context complexity. Minimum 1, maximum 5.
      Task completed: 2-3. User question: 2-5. Error: 1-3. In progress: 1-2. Info reply: 1-3.
      Never exceed 5 options — prune to the most relevant ones.
    priority: required

  - id: slash-command-preference
    trigger: a next-step suggestion corresponds to a known slash command
    instruction: >
      Reference the command using `/command` format so users can copy and execute directly.
      For steps without corresponding commands, use natural language descriptions.
    priority: recommended

  - id: tool-agnostic
    trigger: implementing navigation behavior in any AI tool
    instruction: >
      This standard applies to all UDS-supported AI tools (Claude Code, Cursor, Windsurf, Copilot, etc.).
      Behavioral rules are consistent across tools; rendering format may adapt to tool UI capabilities.
    priority: required

  - id: skill-next-steps-unification
    trigger: creating or modifying a skill's "Next Steps Guidance" section
    instruction: >
      Align the format with this standard's templates. Keep skill-specific contextual recommendations
      but ensure format consistency — use blockquote, recommendation marking, and appropriate template.
    priority: recommended

  - id: model-tier-annotation
    trigger: a next-step option clearly maps to a specific task complexity tier
    instruction: >
      OPTIONALLY append a model tier annotation after the option description:
      〔model: Fast〕, 〔model: Standard〕, or 〔model: Capable〕.
      Use complexity signals from the model-selection standard to determine the tier:
      Fast = single file, unambiguous spec; Standard = 2-5 files, inter-module judgment;
      Capable = 5+ files, architectural decisions.
      Tier names are vendor-neutral — each tool maps them to available models independently.
      Existing skills do not need retroactive updates; new and revised skills are encouraged to adopt.
      Localized notation: 〔模型：Fast〕 / 〔模型：Standard〕 / 〔模型：Capable〕
    priority: optional

  # ── Rules 7-9 (v1.2.0): the answer itself, not the navigation after it ──
  # Borrowed from ayghri/i-have-adhd (MIT), 3 of its 10 rules. The other 7 were dropped:
  # 2 duplicate navigation-footer/recommendation-marking above, and 5 conflict with this
  # standard ("no recap/no closers" contradicts navigation-footer; "cap lists at 5" would
  # truncate evidence tables) or duplicate estimation-standards.
  # Optional in the same sense as model-tier-annotation: a project MAY promote them to required.
  # Their triggers are deliberately precise — a rule too loose to fire is not a rule.

  - id: lead-with-the-finding
    trigger: a response that answers a question, reports an investigation result, or presents a decision
    instruction: >
      Open with what was found or what to do — not the method, not a restatement of the request,
      not a plan for answering. Evidence (file:line, command output, tables, measurements) is
      support and belongs after the claim it supports. This orders the evidence; it does not
      license omitting it.
    priority: optional

  - id: restate-state-each-turn
    trigger: work spanning 3 or more exchanges, or a task with 3 or more steps
    instruction: >
      Restate in one line where the work stands. The reader cannot be assumed to hold
      "we are on step 3 of 5" across messages. Composes with the in-progress template:
      this rule governs the opening, that template governs the footer.
    priority: optional

  - id: no-preamble
    trigger: any substantive response
    instruction: >
      Start with the answer. Do not open with a summary of what you are about to do, an
      acknowledgement of the request, or an assessment of the question. Generalizes the
      anti-sycophancy-prompting prohibition on "opening critique with positive affirmation"
      from critiques to every substantive response — for a different reason: not flattery,
      but the delay it puts between the reader and the answer.
      Does NOT apply to closers: navigation-footer still stands.
    priority: optional

  - id: plain-language-is-the-subject
    trigger: any response explaining a situation, a defect, or a system's behaviour to a human
    instruction: >
      Explain what happened in the words the reader would use. File paths, symbol names, line
      references, command output and version strings are support: they belong after the sentence
      they support, not as the sentence itself. This does NOT license omitting them — a reader who
      wants to verify must be able to. It governs which of the two is the subject.
      Distinct from lead-with-the-finding: that rule orders finding before evidence, this one
      governs register. A response can lead with its finding and still state that finding in
      vocabulary only its author holds; both leave the reader unable to act.
    priority: optional

  - id: every-option-carries-its-trade-off
    trigger: a response asking the reader to choose between two or more courses of action
    instruction: >
      recommendation-marking requires marking the recommended option and giving ITS reason. This
      extends that to the rest: each option states what it buys and what it costs, in its own terms.
      A list where only the recommendation is argued hands the comparison back to the reader, which
      is the work they asked to have done; and an option shown without its downside reads as having
      none. A trade-off is not a hedge — "this may be slightly harder" is not a cost, "this rewrites
      110 files and needs a human to check the translations" is. If an option genuinely has no
      downside worth stating, say so explicitly: an empty cell reads as "not analysed" and the
      reader cannot tell those apart. Composes with adaptive-quantity — trade-offs make each option
      costlier to read, so the 1-5 cap matters more, not less.
    priority: optional

